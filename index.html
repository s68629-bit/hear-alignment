<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>剪床對位輔助系統</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  background: #0f1117; color: #e0e6f0;
  font-family: 'Courier New', monospace;
  min-height: 100vh; display: flex;
  flex-direction: column; align-items: center; padding: 12px;
}
h1 { font-size: 1rem; letter-spacing: 0.12em; color: #7eb8f7; text-transform: uppercase; margin-bottom: 2px; text-align: center; }
.subtitle { font-size: 0.68rem; color: #445566; letter-spacing: 0.06em; margin-bottom: 12px; text-align: center; }
.workspace { width: 100%; max-width: 960px; display: flex; flex-direction: column; gap: 10px; }

/* API Key */
.apikey-row {
  display: flex; gap: 6px; align-items: center;
  background: #0d1018; border: 1px solid #2a3050;
  border-radius: 5px; padding: 8px 10px; flex-wrap: wrap;
}
.apikey-row label { font-size: 0.7rem; color: #556677; white-space: nowrap; }
.apikey-input-wrap { flex: 1; min-width: 180px; display: flex; gap: 6px; align-items: center; }
.apikey-row input {
  flex: 1; padding: 6px 10px;
  background: #181e2c; border: 1px solid #2e3a50;
  border-radius: 4px; color: #8ab4e8;
  font-family: inherit; font-size: 0.76rem;
  min-width: 0;
}
.apikey-row input:focus { outline: none; border-color: #4a7ab5; }
.btn-save-key {
  padding: 6px 10px; border: 1px solid #3a5a3a; border-radius: 4px;
  background: #0e1a10; color: #7fd4a0;
  font-family: inherit; font-size: 0.7rem; cursor: pointer; white-space: nowrap;
}
.btn-save-key:hover { background: #122016; }
.key-status { font-size: 0.65rem; color: #334455; width: 100%; margin-top: 2px; }
.key-status.saved { color: #5dc87a; }

/* 階段指示器 */
.phase-bar {
  display: flex; border-radius: 6px; overflow: hidden;
  border: 1px solid #1e2535;
}
.phase {
  flex: 1; padding: 9px 8px; text-align: center;
  font-size: 0.7rem; letter-spacing: 0.04em;
  background: #0d1018; color: #334455;
  border-right: 1px solid #1e2535;
  transition: background 0.2s;
}
.phase:last-child { border-right: none; }
.phase .phase-num { font-size: 0.6rem; color: #334; margin-bottom: 2px; }
.phase .phase-name { font-weight: bold; }
.phase.active { background: #1a2535; color: #7eb8f7; }
.phase.active .phase-num { color: #4a7ab5; }
.phase.done { background: #0e1e14; color: #5dc87a; }
.phase.done .phase-num { color: #3a8a4a; }

/* Canvas */
.canvas-wrap {
  position: relative; width: 100%;
  background: #181c24; border: 1px solid #2a2e3a;
  border-radius: 6px; overflow: hidden; cursor: crosshair;
  touch-action: none;
}
#mainCanvas { display: block; width: 100%; height: auto; }
.canvas-placeholder {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 220px; color: #334455;
  font-size: 0.82rem; gap: 8px; cursor: pointer;
}

/* 按鈕 */
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn {
  padding: 10px 14px; border: 1px solid #2e3a50; border-radius: 5px;
  background: #181e2c; color: #8ab4e8;
  font-family: inherit; font-size: 0.78rem; letter-spacing: 0.04em;
  cursor: pointer; transition: background 0.15s; white-space: nowrap;
  min-height: 42px;
}
.btn:hover:not(:disabled), .btn:active:not(:disabled) { background: #1e2840; border-color: #4a7ab5; }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn.red  { background: #2a1010; border-color: #aa3333; color: #ff9090; }
.btn.red:active:not(:disabled)  { background: #3a1515; }
.btn.blue { background: #101828; border-color: #3366aa; color: #88bbff; }
.btn.blue:active:not(:disabled) { background: #152035; }
.btn.active-manual { background: #1e3050; border-color: #5588cc; color: #aaccff; }
label.file-btn {
  padding: 10px 14px; border: 1px solid #2e3a50; border-radius: 5px;
  background: #181e2c; color: #8ab4e8;
  font-size: 0.78rem; letter-spacing: 0.04em; cursor: pointer; white-space: nowrap;
  min-height: 42px; display: flex; align-items: center;
}
label.file-btn:active { background: #1e2840; }
input[type=file] { display: none; }
.divider { flex: 1; min-width: 4px; }
.cal-row { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; color: #445566; }
.cal-row input[type=number] {
  width: 60px; padding: 6px;
  background: #181e2c; border: 1px solid #2e3a50; border-radius: 3px;
  color: #8ab4e8; font-family: inherit; font-size: 0.72rem; text-align: center;
}

/* Hint */
.mode-hint {
  font-size: 0.74rem; color: #556677; padding: 8px 12px;
  background: #13161e; border-radius: 4px; border-left: 3px solid #2a3a5a;
  line-height: 1.6;
}
.mode-hint.red  { border-left-color: #cc4444; color: #ffaaaa; }
.mode-hint.blue { border-left-color: #4488cc; color: #aaccff; }
.mode-hint.ok   { border-left-color: #44aa66; color: #88ddaa; }
.mode-hint.ai   { border-left-color: #aa88ff; color: #ccbbff; }
.mode-hint.err  { border-left-color: #cc5555; color: #ffbbbb; }

/* AI 狀態 */
.ai-status {
  display: none; background: #13101e; border: 1px solid #3a2a5a;
  border-radius: 5px; padding: 8px 12px;
  font-size: 0.74rem; color: #9988cc; gap: 8px; align-items: center;
}
.ai-status.show { display: flex; }
.ai-spinner {
  width: 14px; height: 14px; border: 2px solid #3a2a5a; border-top-color: #9988cc;
  border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* AI 確認 */
.ai-confirm {
  display: none; background: #0d0d18; border: 1px solid #2a2050;
  border-radius: 5px; padding: 10px 12px; gap: 8px; flex-direction: column;
}
.ai-confirm.show { display: flex; }
.ai-confirm-text { font-size: 0.72rem; color: #6677aa; line-height: 1.7; }
.ai-confirm-text b { color: #9988cc; }
.ai-confirm-text .warn { color: #ffcc66; }
.ai-confirm-btns { display: flex; gap: 8px; }
.confirm-yes {
  flex: 1; padding: 10px; border: 1px solid #44aa66; border-radius: 4px;
  background: #0e1e14; color: #7fd4a0;
  font-family: inherit; font-size: 0.78rem; cursor: pointer;
}
.confirm-no {
  padding: 10px 14px; border: 1px solid #443344; border-radius: 4px;
  background: #13101a; color: #887799;
  font-family: inherit; font-size: 0.78rem; cursor: pointer;
}

/* 刀口鎖定 */
.knife-locked {
  display: none; background: #0e1a12; border: 1px solid #2a5a3a;
  border-radius: 5px; padding: 8px 12px;
  font-size: 0.72rem; color: #5dc87a; gap: 8px; align-items: center; flex-wrap: wrap;
}
.knife-locked.show { display: flex; }
.btn.unlock { padding: 6px 10px; font-size: 0.68rem; border-color: #7a4444; color: #cc8888; background: #1a0e0e; min-height: unset; }

/* 數值面板 */
.metrics-panel { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.metric-card { background: #13161e; border: 1px solid #1e2535; border-radius: 5px; padding: 10px 10px; }
.metric-label { font-size: 0.58rem; letter-spacing: 0.1em; color: #445566; text-transform: uppercase; margin-bottom: 3px; }
.metric-value { font-size: 1.3rem; font-weight: bold; color: #7eb8f7; }
.metric-value.good { color: #5dc87a; }
.metric-value.warn { color: #e8c060; }
.metric-value.bad  { color: #e86060; }
.metric-sub { font-size: 0.58rem; color: #334455; margin-top: 2px; line-height: 1.4; }

/* 判斷 */
.verdict {
  background: #13161e; border: 1px solid #1e2535;
  border-radius: 5px; padding: 10px 14px;
  display: flex; align-items: center; gap: 10px; font-size: 0.78rem;
}
.verdict-dot { width: 10px; height: 10px; border-radius: 50%; background: #334455; flex-shrink: 0; }
.verdict-dot.good { background: #5dc87a; box-shadow: 0 0 8px #5dc87a99; }
.verdict-dot.warn { background: #e8c060; box-shadow: 0 0 8px #e8c06099; }
.verdict-dot.bad  { background: #e86060; box-shadow: 0 0 8px #e8606099; }
.verdict-text { color: #7a8a9a; line-height: 1.5; }
</style>
</head>
<body>
<h1>⚙ 剪床對位輔助系統</h1>
<p class="subtitle">Shear Blade Alignment Assistant v5</p>

<div class="workspace">

  <!-- API Key -->
  <div class="apikey-row">
    <label>API Key：</label>
    <div class="apikey-input-wrap">
      <input type="password" id="apiKey" placeholder="sk-ant-..." autocomplete="off">
      <button class="btn-save-key" onclick="saveKey()">💾 記住</button>
    </div>
    <div class="key-status" id="keyStatus">🔒 Key 僅存於本機，不會上傳</div>
  </div>

  <!-- 階段指示器 -->
  <div class="phase-bar">
    <div class="phase active" id="phase1">
      <div class="phase-num">STEP 1</div>
      <div class="phase-name">🔴 鎖定刀口</div>
    </div>
    <div class="phase" id="phase2">
      <div class="phase-num">STEP 2</div>
      <div class="phase-name">🔵 對位畫線</div>
    </div>
  </div>

  <!-- Canvas -->
  <div class="canvas-wrap" id="canvasWrap">
    <div class="canvas-placeholder" id="placeholder" onclick="document.getElementById('fileInput1').click()">
      <svg width="44" height="44" viewBox="0 0 48 48" fill="none">
        <rect x="6" y="10" width="36" height="28" rx="3" stroke="#446" stroke-width="1.5"/>
        <circle cx="18" cy="20" r="4" stroke="#446" stroke-width="1.5"/>
        <polyline points="6,32 16,22 24,30 32,20 42,32" stroke="#446" stroke-width="1.5" fill="none"/>
      </svg>
      <span>點擊上傳圖片</span>
      <span style="font-size:0.63rem;color:#334">STEP 1：先拍刀口（未放鎳板）</span>
    </div>
    <canvas id="mainCanvas" style="display:none;"></canvas>
  </div>

  <!-- STEP 1 控制 -->
  <div class="controls" id="ctrl1">
    <label class="file-btn" for="fileInput1">📷 上傳刀口圖片</label>
    <input type="file" id="fileInput1" accept="image/*" capture="environment">
    <button class="btn red" id="btnFindKnife" onclick="findKnife()" disabled>🤖 AI 辨識刀口</button>
    <button class="btn" id="btnManualKnife" onclick="setMode('knife')" disabled>✏ 手動標記</button>
    <div class="divider"></div>
    <div class="cal-row">
      <span>寬(mm):</span>
      <input type="number" id="realWidth" value="200" min="10" max="2000">
    </div>
  </div>

  <!-- STEP 2 控制 -->
  <div class="controls" id="ctrl2" style="display:none;">
    <label class="file-btn" for="fileInput2">📷 上傳鎳板圖片</label>
    <input type="file" id="fileInput2" accept="image/*" capture="environment">
    <button class="btn blue" id="btnFindMark" onclick="findMark()" disabled>🤖 AI 辨識畫線</button>
    <button class="btn" id="btnManualMark" onclick="setMode('mark')" disabled>✏ 手動標記</button>
    <button class="btn" onclick="resetToStep1()" style="font-size:0.72rem;">🔄 重設刀口</button>
  </div>

  <div class="mode-hint" id="modeHint">STEP 1：上傳刀口圖片（鎳板未放入），然後按「AI 辨識刀口」。</div>
  <div class="ai-status" id="aiStatus"><div class="ai-spinner"></div><span id="aiStatusText">AI 分析中…</span></div>

  <!-- AI 確認 -->
  <div class="ai-confirm" id="aiConfirm">
    <div class="ai-confirm-text" id="aiConfirmText"></div>
    <div class="ai-confirm-btns">
      <button class="confirm-yes" onclick="applyPending()">✅ 確認套用</button>
      <button class="confirm-no"  onclick="discardPending()">✕ 捨棄</button>
    </div>
  </div>

  <!-- 刀口已鎖定 -->
  <div class="knife-locked" id="knifeLocked">
    <span>🔒</span>
    <span id="knifeLockedText">刀口基準線已鎖定</span>
    <div class="divider"></div>
    <button class="btn unlock" onclick="resetToStep1()">解鎖</button>
  </div>

  <!-- 數值 -->
  <div class="metrics-panel">
    <div class="metric-card">
      <div class="metric-label">左側偏移</div>
      <div class="metric-value" id="valLeft">—</div>
      <div class="metric-sub" id="subLeft">畫線 vs 刀口</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">右側偏移</div>
      <div class="metric-value" id="valRight">—</div>
      <div class="metric-sub" id="subRight">畫線 vs 刀口</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">平行度差</div>
      <div class="metric-value" id="valParallel">—</div>
      <div class="metric-sub">左右差值</div>
    </div>
  </div>

  <div class="verdict">
    <div class="verdict-dot" id="verdictDot"></div>
    <div class="verdict-text" id="verdictText">完成兩個步驟後顯示量測結果</div>
  </div>

</div>

<script>
// ─── 狀態 ────────────────────────────────────────────────────────────────
let img1=null,img1B64=null,img1Mime='image/jpeg';
let img2=null,img2B64=null,img2Mime='image/jpeg';
let canvasW=0,canvasH=0;
const canvas=document.getElementById('mainCanvas');
const ctx=canvas.getContext('2d');
let currentStep=1;
let knifePoints=null, markPoints=null, pendingPoints=null;
let mode='none', tempPoint=null, manualBuf=[];

// ─── 啟動：讀取儲存的 API Key ────────────────────────────────────────────
(function init(){
  const saved = localStorage.getItem('shear_api_key');
  if (saved) {
    document.getElementById('apiKey').value = saved;
    document.getElementById('keyStatus').textContent = '✅ 已載入儲存的 API Key';
    document.getElementById('keyStatus').className = 'key-status saved';
  }
})();

function saveKey() {
  const k = document.getElementById('apiKey').value.trim();
  if (!k || !k.startsWith('sk-ant-')) {
    document.getElementById('keyStatus').textContent = '⚠ 格式不正確（需以 sk-ant- 開頭）';
    document.getElementById('keyStatus').className = 'key-status';
    return;
  }
  localStorage.setItem('shear_api_key', k);
  document.getElementById('keyStatus').textContent = '✅ 已儲存到本機';
  document.getElementById('keyStatus').className = 'key-status saved';
}

// ─── 載入圖片 ───────────────────────────────────────────────────────────
document.getElementById('fileInput1').addEventListener('change', e => loadImg(e.target.files[0], 1));
document.getElementById('fileInput2').addEventListener('change', e => loadImg(e.target.files[0], 2));

function loadImg(file, step) {
  if (!file) return;
  const mime = file.type || 'image/jpeg';
  const reader = new FileReader();
  reader.onload = ev => {
    const b64 = ev.target.result.split(',')[1];
    const image = new Image();
    image.onload = () => {
      if (step === 1) {
        img1=image; img1B64=b64; img1Mime=mime;
        markPoints=null;
        setupCanvas(image);
        document.getElementById('btnFindKnife').disabled=false;
        document.getElementById('btnManualKnife').disabled=false;
        setHint(knifePoints ? '刀口圖已更新。可重新辨識或繼續 STEP 2。' : 'STEP 1：圖片已載入，按「AI 辨識刀口」。','red');
      } else {
        img2=image; img2B64=b64; img2Mime=mime;
        markPoints=null;
        setupCanvas(image);
        document.getElementById('btnFindMark').disabled=false;
        document.getElementById('btnManualMark').disabled=false;
        setHint('STEP 2：鎳板圖片已載入，按「AI 辨識畫線」。','blue');
      }
      discardPending(); draw();
    };
    image.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function setupCanvas(image) {
  const wrap=document.getElementById('canvasWrap');
  const maxW=wrap.clientWidth||900;
  const scale=Math.min(1,maxW/image.width);
  canvasW=Math.round(image.width*scale);
  canvasH=Math.round(image.height*scale);
  canvas.width=canvasW; canvas.height=canvasH;
  canvas.style.display='block';
  document.getElementById('placeholder').style.display='none';
}

// ─── STEP 1：AI 辨識刀口 ────────────────────────────────────────────────
async function findKnife() {
  if (!img1B64) return;
  const apiKey=getApiKey(); if(!apiKey) return;
  showAiStatus('AI 辨識刀口中…'); setHint('🤖 分析刀口位置…','ai'); discardPending();

  const prompt=`分析這張剪床刀口圖片。

圖中有一條白色亮帶，是剪床下床板的刀口區域。
白色亮帶的「上緣」就是刀口邊緣線。

圖片尺寸：${canvasW}×${canvasH}px，左上角為原點，y向下。

找出刀口邊緣線在以下兩個x位置的y座標：
- 左側：x=${Math.round(canvasW*0.15)}
- 右側：x=${Math.round(canvasW*0.85)}

只回JSON：
{"left_y":數值,"right_y":數值,"confidence":0到1,"description":"白色亮帶的位置描述"}`;

  try {
    const r=await callClaude(apiKey,img1B64,img1Mime,prompt);
    hideAiStatus();
    const lx=canvasW*0.15, rx=canvasW*0.85;
    pendingPoints={type:'knife',p1:{x:lx,y:r.left_y},p2:{x:rx,y:r.right_y},conf:r.confidence,desc:r.description||''};
    drawWithPending();
    const yPct=Math.round(((r.left_y+r.right_y)/2)/canvasH*100);
    showAiConfirm(
      `<b>刀口線：</b>信心 ${Math.round(r.confidence*100)}%，位於圖片高度 ${yPct}%<br>${r.description}<br>` +
      `<span class="warn">請確認圖上紅色預覽線是否貼合白色亮帶上緣。</span>`
    );
    setHint('請確認預覽線位置後套用。','ai');
  } catch(err) {
    hideAiStatus(); setHint('⚠ AI 失敗：'+err.message+'。請手動標記。','err');
  }
}

// ─── STEP 2：AI 辨識畫線 ────────────────────────────────────────────────
async function findMark() {
  if (!img2B64) return;
  if (!knifePoints) { setHint('⚠ 請先完成 STEP 1 鎖定刀口。','err'); return; }
  const apiKey=getApiKey(); if(!apiKey) return;
  showAiStatus('AI 辨識畫線中…'); setHint('🤖 分析畫線位置…','ai'); discardPending();

  const kAvgY=Math.round((knifePoints.p1.y+knifePoints.p2.y)/2);
  const range=Math.round(canvasH*0.35);

  const prompt=`分析這張鎳板對位圖片。

圖中墨綠色鎳板上有藍色或紫色麥克筆畫的橫線（裁切標記）。
刀口白色亮帶約在Y=${kAvgY}px附近。
畫線應在Y=${kAvgY-range}到Y=${kAvgY+range}範圍內。

圖片尺寸：${canvasW}×${canvasH}px，左上角為原點，y向下。

找出藍/紫色麥克筆畫線的中心線在以下兩個x位置的y座標：
- 左側：x=${Math.round(canvasW*0.15)}
- 右側：x=${Math.round(canvasW*0.85)}

只回JSON：
{"left_y":數值,"right_y":數值,"confidence":0到1,"description":"畫線的顏色和位置描述"}`;

  try {
    const r=await callClaude(apiKey,img2B64,img2Mime,prompt);
    hideAiStatus();
    const lx=canvasW*0.15, rx=canvasW*0.85;
    pendingPoints={type:'mark',p1:{x:lx,y:r.left_y},p2:{x:rx,y:r.right_y},conf:r.confidence,desc:r.description||''};
    drawWithPending();
    const yPct=Math.round(((r.left_y+r.right_y)/2)/canvasH*100);
    const kPct=Math.round(kAvgY/canvasH*100);
    showAiConfirm(
      `<b>畫線：</b>信心 ${Math.round(r.confidence*100)}%，位於圖片高度 ${yPct}%（刀口在 ${kPct}%）<br>${r.description}<br>` +
      `<span class="warn">請確認藍色預覽線是否貼合麥克筆跡。</span>`
    );
    setHint('請確認預覽線位置後套用。','ai');
  } catch(err) {
    hideAiStatus(); setHint('⚠ AI 失敗：'+err.message+'。請手動標記。','err');
  }
}

// ─── 套用 / 捨棄 ────────────────────────────────────────────────────────
function applyPending() {
  if (!pendingPoints) return;
  if (pendingPoints.type==='knife') { knifePoints={p1:pendingPoints.p1,p2:pendingPoints.p2}; lockKnife(); }
  else { markPoints={p1:pendingPoints.p1,p2:pendingPoints.p2}; setHint('✅ 畫線已套用。','ok'); }
  pendingPoints=null; hideAiConfirm(); draw();
  if (knifePoints&&markPoints) updateMetrics();
}

function discardPending() {
  pendingPoints=null; hideAiConfirm();
}

function lockKnife() {
  currentStep=2;
  document.getElementById('phase1').className='phase done';
  document.getElementById('phase2').className='phase active';
  document.getElementById('ctrl1').style.display='none';
  document.getElementById('ctrl2').style.display='flex';
  document.getElementById('knifeLocked').classList.add('show');
  const avg=Math.round((knifePoints.p1.y+knifePoints.p2.y)/2);
  document.getElementById('knifeLockedText').textContent=`刀口已鎖定（Y≈${avg}px）`;
  setHint('✅ 刀口鎖定！STEP 2：上傳放入鎳板的圖片，按「AI 辨識畫線」。','ok');
}

function resetToStep1() {
  knifePoints=null; markPoints=null; pendingPoints=null; mode='none'; tempPoint=null; manualBuf=[];
  currentStep=1;
  document.getElementById('phase1').className='phase active';
  document.getElementById('phase2').className='phase';
  document.getElementById('ctrl1').style.display='flex';
  document.getElementById('ctrl2').style.display='none';
  document.getElementById('knifeLocked').classList.remove('show');
  hideAiConfirm(); resetMetrics();
  if (img1) { setupCanvas(img1); draw(); }
  setHint('STEP 1：上傳刀口圖片，按「AI 辨識刀口」。','red');
}

// ─── 手動標記 ───────────────────────────────────────────────────────────
function setMode(m) {
  mode=m; tempPoint=null; manualBuf=[];
  document.getElementById('btnManualKnife').className='btn'+(m==='knife'?' active-manual':'');
  if(document.getElementById('btnManualMark'))
    document.getElementById('btnManualMark').className='btn'+(m==='mark'?' active-manual':'');
  setHint(m==='knife'?'✏ 手動刀口：點左端 → 右端 各1點':'✏ 手動畫線：點左端 → 右端 各1點', m==='knife'?'red':'blue');
  draw();
}

// Touch 支援
canvas.addEventListener('click', handleCanvasClick);
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  const t=e.changedTouches[0];
  const rect=canvas.getBoundingClientRect();
  const x=(t.clientX-rect.left)*(canvasW/rect.width);
  const y=(t.clientY-rect.top)*(canvasH/rect.height);
  handleCanvasPoint(x,y);
});

function handleCanvasClick(e) {
  const rect=canvas.getBoundingClientRect();
  handleCanvasPoint((e.clientX-rect.left)*(canvasW/rect.width),(e.clientY-rect.top)*(canvasH/rect.height));
}

function handleCanvasPoint(x,y) {
  if (mode==='none') return;
  manualBuf.push({x,y}); tempPoint={x,y};
  if (manualBuf.length===1) {
    setHint(`第1點已標（${Math.round(x)},${Math.round(y)}），請點第2點`,mode==='knife'?'red':'blue');
  } else if (manualBuf.length>=2) {
    const p1=manualBuf[manualBuf.length-2], p2=manualBuf[manualBuf.length-1];
    tempPoint=null;
    if (mode==='knife') { knifePoints={p1,p2}; lockKnife(); }
    else { markPoints={p1,p2}; setHint('✅ 畫線已標記。','ok'); }
    mode='none'; manualBuf=[];
    draw();
    if (knifePoints&&markPoints) updateMetrics();
    return;
  }
  draw();
}

// ─── 繪製 ──────────────────────────────────────────────────────────────
function draw() {
  const curImg=currentStep===1?img1:(img2||img1);
  if(!curImg) return;
  ctx.clearRect(0,0,canvasW,canvasH);
  ctx.drawImage(curImg,0,0,canvasW,canvasH);
  if (knifePoints) drawLine(knifePoints.p1,knifePoints.p2,'#ff5555','刀口基準');
  if (markPoints)  drawLine(markPoints.p1, markPoints.p2, '#55aaff','畫線');
  if (tempPoint) {
    ctx.beginPath(); ctx.arc(tempPoint.x,tempPoint.y,7,0,Math.PI*2);
    ctx.fillStyle=mode==='knife'?'#ff5555':'#55aaff';
    ctx.globalAlpha=0.85; ctx.fill(); ctx.globalAlpha=1;
  }
  if (knifePoints&&markPoints) drawMeasureArrows();
}

function drawWithPending() {
  draw();
  if(!pendingPoints) return;
  ctx.save(); ctx.globalAlpha=0.5;
  drawLine(pendingPoints.p1,pendingPoints.p2,
    pendingPoints.type==='knife'?'#ff8888':'#88ccff',
    (pendingPoints.type==='knife'?'刀口':'畫線')+'（預覽）');
  ctx.restore();
}

function drawLine(p1,p2,color,label) {
  const e=extendLine(p1,p2);
  ctx.save();
  ctx.beginPath(); ctx.moveTo(e.x1,e.y1); ctx.lineTo(e.x2,e.y2);
  ctx.strokeStyle=color; ctx.lineWidth=2; ctx.setLineDash([7,4]); ctx.stroke(); ctx.setLineDash([]);
  [p1,p2].forEach(p=>{
    ctx.beginPath(); ctx.arc(p.x,p.y,5,0,Math.PI*2);
    ctx.fillStyle=color; ctx.globalAlpha=0.8; ctx.fill(); ctx.globalAlpha=1;
  });
  ctx.fillStyle=color; ctx.font='bold 12px Courier New';
  ctx.shadowColor='#000'; ctx.shadowBlur=3;
  ctx.fillText(label,12,(p1.y+p2.y)/2-7);
  ctx.shadowBlur=0; ctx.restore();
}

function drawMeasureArrows() {
  const lx=canvasW*0.25, rx=canvasW*0.75;
  const ky_l=yAtX(knifePoints.p1,knifePoints.p2,lx);
  const ky_r=yAtX(knifePoints.p1,knifePoints.p2,rx);
  const my_l=yAtX(markPoints.p1, markPoints.p2, lx);
  const my_r=yAtX(markPoints.p1, markPoints.p2, rx);
  drawArrow(lx,ky_l,lx,my_l,'#ffd060');
  drawArrow(rx,ky_r,rx,my_r,'#ffd060');
  const ppm=(parseFloat(document.getElementById('realWidth').value)||200)/canvasW;
  ctx.save(); ctx.fillStyle='#ffd060'; ctx.font='bold 12px Courier New';
  ctx.shadowColor='#000'; ctx.shadowBlur=3;
  ctx.fillText(((my_l-ky_l)*ppm).toFixed(2)+'mm',lx+8,(ky_l+my_l)/2+4);
  ctx.fillText(((my_r-ky_r)*ppm).toFixed(2)+'mm',rx+8,(ky_r+my_r)/2+4);
  ctx.shadowBlur=0; ctx.restore();
}

function drawArrow(x1,y1,x2,y2,color) {
  if(Math.abs(y2-y1)<2) return;
  ctx.save();
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
  ctx.strokeStyle=color; ctx.lineWidth=1.8; ctx.stroke();
  const a=Math.atan2(y2-y1,0),s=7;
  ctx.beginPath(); ctx.moveTo(x2,y2);
  ctx.lineTo(x2-s*Math.cos(a-0.4),y2-s*Math.sin(a-0.4));
  ctx.lineTo(x2-s*Math.cos(a+0.4),y2-s*Math.sin(a+0.4));
  ctx.closePath(); ctx.fillStyle=color; ctx.fill(); ctx.restore();
}

// ─── 數值 ──────────────────────────────────────────────────────────────
function updateMetrics() {
  const lx=canvasW*0.25,rx=canvasW*0.75;
  const ky_l=yAtX(knifePoints.p1,knifePoints.p2,lx);
  const ky_r=yAtX(knifePoints.p1,knifePoints.p2,rx);
  const my_l=yAtX(markPoints.p1, markPoints.p2, lx);
  const my_r=yAtX(markPoints.p1, markPoints.p2, rx);
  const ppm=(parseFloat(document.getElementById('realWidth').value)||200)/canvasW;
  const dl=(my_l-ky_l)*ppm, dr=(my_r-ky_r)*ppm, diff=Math.abs(dl-dr);
  const fmt=v=>(v>=0?'+':'')+v.toFixed(2);
  document.getElementById('valLeft').textContent=fmt(dl)+' mm';
  document.getElementById('valRight').textContent=fmt(dr)+' mm';
  document.getElementById('valParallel').textContent=diff.toFixed(2)+' mm';
  document.getElementById('subLeft').textContent=dl>=0?'畫線在刀口下方':'畫線在刀口上方';
  document.getElementById('subRight').textContent=dr>=0?'畫線在刀口下方':'畫線在刀口上方';
  const T=0.5;
  document.getElementById('valLeft').className='metric-value '+cls(Math.abs(dl),T);
  document.getElementById('valRight').className='metric-value '+cls(Math.abs(dr),T);
  document.getElementById('valParallel').className='metric-value '+cls(diff,T*0.5);
  const maxOff=Math.max(Math.abs(dl),Math.abs(dr));
  const dot=document.getElementById('verdictDot'),txt=document.getElementById('verdictText');
  if(maxOff<T&&diff<T*0.5){dot.className='verdict-dot good';txt.textContent=`✅ 對位良好 — 最大偏移 ${maxOff.toFixed(2)} mm，平行差 ${diff.toFixed(2)} mm`;}
  else if(maxOff<T*2){dot.className='verdict-dot warn';txt.textContent=`⚠ 需微調 — 偏移 ${maxOff.toFixed(2)} mm，平行差 ${diff.toFixed(2)} mm`;}
  else{dot.className='verdict-dot bad';txt.textContent=`✗ 偏移過大 — ${maxOff.toFixed(2)} mm，請重新對位`;}
  draw();
}

function resetMetrics() {
  ['valLeft','valRight','valParallel'].forEach(id=>{document.getElementById(id).textContent='—';document.getElementById(id).className='metric-value';});
  document.getElementById('subLeft').textContent='畫線 vs 刀口';
  document.getElementById('subRight').textContent='畫線 vs 刀口';
  document.getElementById('verdictDot').className='verdict-dot';
  document.getElementById('verdictText').textContent='完成兩個步驟後顯示量測結果';
}

// ─── Claude API ────────────────────────────────────────────────────────
async function callClaude(apiKey,b64,mime,prompt) {
  const resp=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:600,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:mime,data:b64}},{type:'text',text:prompt}]}]})
  });
  if(!resp.ok){const e=await resp.json().catch(()=>({}));throw new Error(e.error?.message||`HTTP ${resp.status}`);}
  const data=await resp.json();
  const raw=data.content.map(c=>c.text||'').join('');
  return JSON.parse(raw.replace(/```json|```/g,'').trim());
}

function getApiKey(){
  const k=document.getElementById('apiKey').value.trim();
  if(!k||!k.startsWith('sk-ant-')){setHint('⚠ 請先填入有效的 API Key（sk-ant-...）','err');return null;}
  return k;
}

// ─── UI ────────────────────────────────────────────────────────────────
function showAiStatus(msg){document.getElementById('aiStatusText').textContent=msg;document.getElementById('aiStatus').classList.add('show');}
function hideAiStatus(){document.getElementById('aiStatus').classList.remove('show');}
function showAiConfirm(html){document.getElementById('aiConfirmText').innerHTML=html;document.getElementById('aiConfirm').classList.add('show');}
function hideAiConfirm(){document.getElementById('aiConfirm').classList.remove('show');}
function setHint(msg,type=''){const el=document.getElementById('modeHint');el.textContent=msg;el.className='mode-hint'+(type?' '+type:'');}

// ─── 幾何 ──────────────────────────────────────────────────────────────
function yAtX(p1,p2,x){if(Math.abs(p2.x-p1.x)<0.5)return p1.y;return p1.y+(p2.y-p1.y)*(x-p1.x)/(p2.x-p1.x);}
function extendLine(p1,p2){if(Math.abs(p2.x-p1.x)<0.5)return{x1:p1.x,y1:0,x2:p1.x,y2:canvasH};const m=(p2.y-p1.y)/(p2.x-p1.x),b=p1.y-m*p1.x;return{x1:0,y1:b,x2:canvasW,y2:m*canvasW+b};}
function cls(v,t){return v<t*0.5?'good':v<t?'warn':'bad';}
</script>
