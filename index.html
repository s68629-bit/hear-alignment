<!DOCTYPE html>
<html lang="zh-TW">
<!--
=============================================================================
 剪床對位輔助系統 — 動態即時版 / Shear Blade Alignment Assistant Live
 檔案名稱：live.html
 部署位置：GitHub Pages — s68629-bit.github.io/hear-alignment/live.html
=============================================================================
 【版次編碼原則】
   整數位（X.0）：架構性重大變更、功能新增
   小數位（X.Y）：參數調整、UI 改善、Bug 修正

 【版次歷史】
 ─────────────────────────────────────────────────────────────────────────
 v1.0  動態即時版初版。兩階段：先鎖定刀口，再追蹤畫線。
 v2.0  完全自動雙線同步偵測。斜角俯視，上半部找畫線，下半部找刀口。
        加入時間軸平滑消除幀間跳動。
v3.1  刀口搜尋改為全畫面（排除上下5%邊緣），不再限制下半部。
        解決刀口在畫面上半部時偵測不到的問題。
 v3.0  智慧刀口追蹤 + 遮蓋偵測：
        - 刀口每幀動態偵測（8段），有效段顯示亮紅色
        - 鎳板推入遮蓋刀口時，被遮住的段自動切換暗紅色延伸線
        - 未遮住的段繼續動態更新，補償手持抖動
        - 手動點擊畫線位置後開始即時追蹤藍色畫線
        - 亮紅/暗紅 + 亮藍/暗藍 視覺邏輯統一
 ─────────────────────────────────────────────────────────────────────────
 目前版本：v3.5
 最後更新：2025-06
=============================================================================
-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>剪床對位 — 即時版</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: #0f1117; color: #e0e6f0; font-family: 'Courier New', monospace; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 10px; }
h1 { font-size: 0.95rem; letter-spacing: 0.12em; color: #7eb8f7; text-transform: uppercase; margin-bottom: 2px; text-align: center; }
.subtitle { font-size: 0.65rem; color: #445566; margin-bottom: 10px; text-align: center; }
.workspace { width: 100%; max-width: 960px; display: flex; flex-direction: column; gap: 8px; }

/* 影像區 */
.video-wrap { position: relative; width: 100%; background: #181c24; border: 1px solid #2a2e3a; border-radius: 6px; overflow: hidden; min-height: 200px; }
#liveVideo { display: block; width: 100%; height: auto; }
#overlayCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
.video-wrap.click-active { cursor: crosshair; }
.video-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 240px; color: #334455; font-size: 0.82rem; gap: 8px; }

/* 狀態列 */
.live-status { display: flex; align-items: center; gap: 8px; background: #0a1a0a; border: 1px solid #2a5a2a; border-radius: 5px; padding: 7px 12px; font-size: 0.72rem; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: #5dc87a; box-shadow: 0 0 6px #5dc87a; animation: pulse 1s infinite; flex-shrink: 0; }
.live-dot.off { background: #445566; box-shadow: none; animation: none; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.4} }
.live-txt { color: #5dc87a; flex: 1; }
.live-txt.off { color: #445566; }
.live-fps { font-size: 0.65rem; color: #3a6a3a; }

/* 偵測狀態 */
.detect-row { display: flex; gap: 8px; }
.dc { flex: 1; padding: 6px 8px; border-radius: 4px; font-size: 0.67rem; text-align: center; background: #0d1018; border: 1px solid #1e2535; color: #334455; }
.dc.full  { background: #0e1e14; border-color: #3a7a4a; color: #5dc87a; }
.dc.partial { background: #1a1a0a; border-color: #7a6a2a; color: #ccaa44; }
.dc.lost  { background: #1a0e0e; border-color: #5a2a2a; color: #cc6666; }

/* 按鈕 */
.controls { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { padding: 10px 14px; border: 1px solid #2e3a50; border-radius: 5px; background: #181e2c; color: #8ab4e8; font-family: inherit; font-size: 0.76rem; cursor: pointer; white-space: nowrap; min-height: 42px; transition: all 0.15s; }
.btn:active:not(:disabled) { background: #1e2840; }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn.green  { background: #0e1e14; border-color: #3a8a4a; color: #7fd4a0; }
.btn.green.on { background: #1a3a1a; border-color: #5aaa6a; }
.btn.blue   { background: #101828; border-color: #3366aa; color: #88bbff; }
.btn.blue.click-active { background: #1e3a28; border-color: #3a8a4a; color: #7fd4a0; animation: blink 0.8s infinite; }
.btn.orange { background: #1e1a0a; border-color: #8a7a3a; color: #ddcc88; }
.btn.orange.on { background: #2a2210; border-color: #aaaa44; }
@keyframes blink { 0%,100%{opacity:1}50%{opacity:0.6} }
.divider { flex: 1; }

/* 提示 */
.hint { font-size: 0.73rem; color: #556677; padding: 7px 12px; background: #13161e; border-radius: 4px; border-left: 3px solid #2a3a5a; line-height: 1.6; }
.hint.ok   { border-left-color: #44aa66; color: #88ddaa; }
.hint.err  { border-left-color: #cc5555; color: #ffbbbb; }
.hint.blue { border-left-color: #4488cc; color: #aaccff; }
.hint.warn { border-left-color: #cc9900; color: #ddbb66; }

/* 圖例 */
.legend { display: flex; gap: 10px; flex-wrap: wrap; background: #0d1018; border: 1px solid #1e2535; border-radius: 5px; padding: 7px 12px; }
.leg { display: flex; align-items: center; gap: 5px; font-size: 0.64rem; color: #556677; }
.leg-line { width: 20px; height: 3px; border-radius: 1px; }
.leg-line.red-hi  { background: #ff5555; }
.leg-line.red-lo  { background: #7a2a2a; border: 1px dashed #aa4444; }
.leg-line.blue-hi { background: #55aaff; }
.leg-line.blue-lo { background: #1a3a5a; border: 1px dashed #335577; }

/* 校準 */
.cal { display: flex; align-items: center; gap: 6px; font-size: 0.7rem; color: #445566; flex-wrap: wrap; }
.cal input { width: 58px; padding: 5px; background: #181e2c; border: 1px solid #2e3a50; border-radius: 3px; color: #8ab4e8; font-family: inherit; font-size: 0.7rem; text-align: center; }
.cal-tip { font-size: 0.6rem; color: #334455; width: 100%; }

/* 數值 */
.metrics { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
.mc { background: #13161e; border: 1px solid #1e2535; border-radius: 5px; padding: 10px; }
.ml { font-size: 0.56rem; letter-spacing: 0.1em; color: #445566; text-transform: uppercase; margin-bottom: 3px; }
.mv { font-size: 1.35rem; font-weight: bold; color: #7eb8f7; }
.mv.good { color: #5dc87a; }
.mv.warn { color: #e8c060; }
.mv.bad  { color: #e86060; }
.ms { font-size: 0.56rem; color: #334455; margin-top: 2px; }

/* 判斷 */
.verdict { background: #13161e; border: 1px solid #1e2535; border-radius: 5px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; font-size: 0.76rem; }
.vdot { width: 10px; height: 10px; border-radius: 50%; background: #334455; flex-shrink: 0; }
.vdot.good { background: #5dc87a; box-shadow: 0 0 8px #5dc87a99; }
.vdot.warn { background: #e8c060; box-shadow: 0 0 8px #e8c06099; }
.vdot.bad  { background: #e86060; box-shadow: 0 0 8px #e8606099; }
.vtxt { color: #7a8a9a; line-height: 1.5; }
</style>
</head>
<body>
<h1>⚙ 剪床對位 — 即時版</h1>
<p class="subtitle">v3.5 — 刀口改找白色下緣 + 鎖定直線模式 + 移除暫停</p>

<div class="workspace">

  <div class="video-wrap" id="videoWrap">
    <div class="video-placeholder" id="placeholder">
      <svg width="44" height="44" viewBox="0 0 48 48" fill="none">
        <rect x="4" y="8" width="40" height="28" rx="3" stroke="#446" stroke-width="1.5"/>
        <circle cx="24" cy="22" r="7" stroke="#446" stroke-width="1.5"/>
        <rect x="18" y="4" width="12" height="5" rx="1.5" stroke="#446" stroke-width="1.5"/>
      </svg>
      <span>按「開啟攝影機」開始</span>
      <span style="font-size:0.63rem;color:#334">斜角俯視，畫面需同時看到刀口和鎳板</span>
    </div>
    <video id="liveVideo" autoplay playsinline muted style="display:none;"></video>
    <canvas id="overlayCanvas" style="display:none;"></canvas>
  </div>

  <div class="live-status">
    <div class="live-dot off" id="liveDot"></div>
    <span class="live-txt off" id="liveTxt">攝影機未開啟</span>
    <span class="live-fps" id="liveFps"></span>
  </div>

  <div class="detect-row">
    <div class="dc" id="dcKnife">🔴 刀口：等待</div>
    <div class="dc" id="dcMark">🔵 畫線：等待</div>
  </div>

  <div class="controls">
    <button class="btn green" id="btnCam" onclick="toggleCam()">📹 開啟攝影機</button>
    <button class="btn" id="btnLockKnife" onclick="lockKnifeBaseline()" disabled style="border-color:#aa6633;color:#ffcc88;background:#1e1208;">🔒 鎖定刀口</button>
    <button class="btn blue" id="btnClickMark" onclick="startMarkClick()" disabled>👆 點擊畫線定位</button>
    <div class="divider"></div>
    <button class="btn" onclick="resetMark()" style="font-size:0.7rem;border-color:#335577;color:#6688aa;">🔄 重設畫線</button>
    <button class="btn" onclick="resetAll()" style="font-size:0.7rem;border-color:#7a4444;color:#cc8888;">✕ 全部重設</button>
  </div>

  <div class="hint" id="hint">請按「開啟攝影機」，對準剪床刀口，程式自動偵測紅色刀口線。</div>

  <div class="legend">
    <div class="leg"><div class="leg-line red-hi"></div><span>刀口（實測）</span></div>
    <div class="leg"><div class="leg-line red-lo"></div><span>刀口（遮蓋延伸）</span></div>
    <div class="leg"><div class="leg-line blue-hi"></div><span>畫線（實測）</span></div>
    <div class="leg"><div class="leg-line blue-lo"></div><span>畫線（延伸）</span></div>
  </div>

  <div class="cal">
    <span>畫面實際寬度：</span>
    <input type="number" id="realWidth" value="200" min="10" max="2000">
    <span>mm</span>
    <span class="cal-tip">用尺量拍攝畫面實際寬度，固定架設後只需校準一次。</span>
  </div>

  <div class="metrics">
    <div class="mc"><div class="ml">左側偏移</div><div class="mv" id="vL">—</div><div class="ms" id="sL">畫線 vs 刀口</div></div>
    <div class="mc"><div class="ml">右側偏移</div><div class="mv" id="vR">—</div><div class="ms" id="sR">畫線 vs 刀口</div></div>
    <div class="mc"><div class="ml">平行度差</div><div class="mv" id="vP">—</div><div class="ms">左右差值</div></div>
  </div>

  <div class="verdict">
    <div class="vdot" id="vdot"></div>
    <div class="vtxt" id="vtxt">開啟攝影機後自動偵測刀口，放入鎳板後點擊畫線</div>
  </div>

</div>

<script>
// ─── 狀態 ─────────────────────────────────────────────────────────────────
const video   = document.getElementById('liveVideo');
const overlay = document.getElementById('overlayCanvas');
const octx    = overlay.getContext('2d');
let W=0, H=0;
let stream=null, running=false, frozen=false, raf=null;
let frameCount=0, lastFpsT=0;

// 刀口：8段，每段有「有效/遮蓋」狀態
let lastKnifeGlobalY = null; // 上一幀的刀口 Y
let knifeBaseline = null;     // 鎖定時的基準直線 {slope, intercept}
let knifeBaselineLocked = false; // 是否已鎖定
const KNIFE_SEGS = 8;
let knifeSegs = null;   // Array of { x, y, valid, covered }
let knifeLinear = null; // { p1, p2 } 量測用

// 畫線：點擊後啟動追蹤
let markAnchorY = null;
let markData    = null;   // { segXs, segYs, segValid, spline }
let markClickPending = false;

// 鎖定刀口
let knifeLockedSegs=null;
let knifeLockedLinear=null;
let knifeLocked=false;

// 時間軸平滑
const SMOOTH_N = 5;
let knifeHistory = [];  // 每幀各段 y 值
let markHistory  = [];

// offscreen canvas
let offC=null, offCtx2=null;

// ─── 攝影機 ───────────────────────────────────────────────────────────────
async function toggleCam(){
  if(running){ stopCam(); return; }
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}}
    });
    video.srcObject=stream; video.style.display='block';
    document.getElementById('placeholder').style.display='none';
    video.onloadedmetadata=()=>{
      const wrap=document.getElementById('videoWrap');
      const scale=Math.min(1,(wrap.clientWidth||900)/video.videoWidth);
      W=Math.round(video.videoWidth*scale); H=Math.round(video.videoHeight*scale);
      overlay.width=W; overlay.height=H;
      overlay.style.display='block'; overlay.style.width='100%';
    };
    running=true;
    document.getElementById('btnCam').className='btn green on';
    document.getElementById('btnCam').textContent='📹 攝影機開啟中';
    document.getElementById('btnClickMark').disabled=false;
    setLive(true,'即時偵測中');
    setHint('✅ 攝影機已開啟，正在偵測刀口紅線。確認紅線位置後，推入鎳板，再按「點擊畫線定位」。','ok');
    loop();
  } catch(e){ setHint('⚠ 無法開啟攝影機：'+e.message,'err'); }
}

function stopCam(){
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  running=false; frozen=false;
  if(raf){ cancelAnimationFrame(raf); raf=null; }
  video.style.display='none'; video.srcObject=null; overlay.style.display='none';
  document.getElementById('btnCam').className='btn green';
  document.getElementById('btnCam').textContent='📹 開啟攝影機';
  document.getElementById('btnClickMark').disabled=true;
  setLive(false,'攝影機已關閉');
  resetAll();
}


// ─── 點擊畫線定位 ─────────────────────────────────────────────────────────
function startMarkClick(){
  if(!running){ setHint('⚠ 請先開啟攝影機。','err'); return; }
  markClickPending=true;
  document.getElementById('videoWrap').classList.add('click-active');
  document.getElementById('btnClickMark').className='btn blue click-active';
  document.getElementById('btnClickMark').textContent='👆 點擊中…';
  setHint('👆 請點擊鎳板上藍色/紫色畫線的位置（點附近即可）。','blue');
}

// 點擊事件改用 videoWrap（iOS Safari 相容性更好）
document.getElementById('videoWrap').addEventListener('click', e=>{
  if(!markClickPending) return;
  const r=overlay.getBoundingClientRect();
  const x=(e.clientX-r.left)*(W/r.width), y=(e.clientY-r.top)*(H/r.height);
  handleMarkClick(x,y);
});
document.getElementById('videoWrap').addEventListener('touchend', e=>{
  if(!markClickPending) return;
  e.preventDefault();
  const t=e.changedTouches[0], r=overlay.getBoundingClientRect();
  handleMarkClick((t.clientX-r.left)*(W/r.width),(t.clientY-r.top)*(H/r.height));
},{passive:false});

function handleMarkClick(x,y){
  markClickPending=false;
  document.getElementById('videoWrap').classList.remove('click-active');
  document.getElementById('btnClickMark').className='btn blue';
  document.getElementById('btnClickMark').textContent='👆 點擊畫線定位';
  if(document.getElementById('btnLockKnife')){ document.getElementById('btnLockKnife').style='border-color:#aa6633;color:#ffcc88;background:#1e1208;'; document.getElementById('btnLockKnife').textContent='🔒 鎖定刀口'; document.getElementById('btnLockKnife').disabled=false; }
  markAnchorY=y;
  markHistory=[];
  setHint('✅ 畫線已定位，即時追蹤中。調整鎳板使偏差趨近 0。','ok');
}

function lockKnife(){
  if(!knifeSegs||!knifeLinear){ setHint('⚠ 請先對準刀口，等紅線穩定後再鎖定。','err'); return; }
  knifeLockedSegs=[...knifeSegs];
  knifeLockedLinear={p1:{...knifeLinear.p1},p2:{...knifeLinear.p2}};
  knifeLocked=true;
  document.getElementById('btnClickMark').disabled=false;
  setHint('✅ 刀口已鎖定！現在推入鎳板，按「點擊畫線定位」點擊畫線。','ok');
}


function lockKnifeBaseline(){
  if(!knifeSegs||!knifeLinear){ setHint('⚠ 請先對準刀口，等紅線穩定後再鎖定。','err'); return; }
  const validSegs=knifeSegs.filter(s=>s.valid&&!s.covered);
  if(validSegs.length<3){ setHint('⚠ 有效段太少，請調整角度使刀口更清楚。','err'); return; }
  const {slope,intercept}=linReg(validSegs.map(s=>s.x),validSegs.map(s=>s.y));
  knifeBaseline={slope,intercept};
  knifeBaselineLocked=true;
  document.getElementById('btnLockKnife').style='border-color:#44aa66;color:#7fd4a0;background:#0e1e14;';
  document.getElementById('btnLockKnife').textContent='🔒 已鎖定';
  document.getElementById('btnLockKnife').disabled=true;
  document.getElementById('btnClickMark').disabled=false;
  setHint('✅ 刀口已鎖定為直線！推入鎳板後按「點擊畫線定位」。','ok');
}

function resetMark(){
  markAnchorY=null; markData=null; markHistory=[];
  document.getElementById('videoWrap').classList.remove('click-active');
  resetMetrics();
  setHint('畫線已重設。推入鎳板後按「點擊畫線定位」。','blue');
  setDC('dcMark','等待','');
}

function resetAll(){
  knifeSegs=null; knifeLinear=null; knifeHistory=[]; lastKnifeGlobalY=null;
  knifeBaseline=null; knifeBaselineLocked=false;
  knifeLockedSegs=null; knifeLockedLinear=null; knifeLocked=false;
  markAnchorY=null; markData=null; markHistory=[];
  markClickPending=false;
  document.getElementById('videoWrap').classList.remove('click-active');
  document.getElementById('btnClickMark').className='btn blue';
  document.getElementById('btnClickMark').textContent='👆 點擊畫線定位';
  if(document.getElementById('btnLockKnife')){ document.getElementById('btnLockKnife').style='border-color:#aa6633;color:#ffcc88;background:#1e1208;'; document.getElementById('btnLockKnife').textContent='🔒 鎖定刀口'; document.getElementById('btnLockKnife').disabled=false; }
  resetMetrics();
  setDC('dcKnife','等待',''); setDC('dcMark','等待','');
  setHint('已全部重設。對準刀口，程式自動偵測紅線。','ok');
}

// ─── 主迴圈 ───────────────────────────────────────────────────────────────
function loop(){
  if(!running){ return; }
  raf=requestAnimationFrame(loop);
  if(frozen) return;

  frameCount++;
  const now=performance.now();
  if(now-lastFpsT>1000){
    document.getElementById('liveFps').textContent=frameCount+' fps';
    frameCount=0; lastFpsT=now;
  }

  const fd=getFrame(); if(!fd) return;

  // ── 刀口偵測（每幀，帶遮蓋偵測）──
  const kResult=detectKnifeWithCover(fd);
  if(kResult){
    knifeHistory.push(kResult);
    if(knifeHistory.length>SMOOTH_N) knifeHistory.shift();
    knifeSegs=smoothKnifeHistory(knifeHistory);
    knifeLinear=knifeToLinear(knifeSegs);
    const validCount=knifeSegs.filter(s=>s.valid&&!s.covered).length;
    if(validCount>=4) setDC('dcKnife','實測'+validCount+'/'+KNIFE_SEGS+'段','full');
    else if(validCount>=1) setDC('dcKnife','部分'+validCount+'/'+KNIFE_SEGS+'段（遮蓋中）','partial');
    else setDC('dcKnife','遮蓋，延伸中','partial');
  } else {
    setDC('dcKnife','未偵測','lost');
  }

  // ── 畫線追蹤（點擊後才啟動）──
  if(markAnchorY!==null){
    const mResult=detectMark(fd, markAnchorY);
    if(mResult && mResult.validCount>=2){
      markHistory.push(mResult);
      if(markHistory.length>SMOOTH_N) markHistory.shift();
      markData=smoothMarkHistory(markHistory);
      // 更新 anchorY 為當前最佳值（讓追蹤跟著鎳板移動）
      markAnchorY=markAnchorY*0.85 + mResult.bestY*0.15;
      setDC('dcMark','實測'+mResult.validCount+'/16段','full');
    } else {
      setDC('dcMark','搜尋中…','partial');
    }
  }

  // ── 繪製 ──
  octx.clearRect(0,0,W,H);
  // 鎖定模式：使用鎖定的刀口座標
  if(knifeLocked){
    // 畫鎖定的刀口（含遮蓋偵測：比對當前幀判斷哪些段被遮蓋）
    if(knifeLockedSegs) drawKnifeLockedSegs(knifeSegs);
  } else {
    if(knifeSegs) drawKnifeSegs();
  }
  if(markData)  drawMark();
  const activeKnifeLinear = knifeLocked ? knifeLockedLinear : knifeLinear;
  if(activeKnifeLinear && markData) { drawMeasureArrows(activeKnifeLinear); updateMetrics(activeKnifeLinear); }
}

function getFrame(){
  if(!offC){ offC=document.createElement('canvas'); offCtx2=offC.getContext('2d'); }
  offC.width=W; offC.height=H;
  offCtx2.drawImage(video,0,0,W,H);
  return offCtx2.getImageData(0,0,W,H);
}

// ══════════════════════════════════════════════════════════════════════════
// 刀口偵測：8段分別偵測，並判斷每段是否被遮蓋
// ══════════════════════════════════════════════════════════════════════════
function detectKnifeWithCover(fd){
  const data=fd.data;
  const xL=Math.floor(W*0.1), xR=Math.floor(W*0.9);

  // ══ 新演算法：找白色區域下緣 ══
  // 白色刀口亮帶：R,G,B 都很高（>180）
  // 每行統計白色像素比例，找白色區域的最下緣
  const WHITE_THR = 160; // 白色像素門檻
  const rowWhite = new Float32Array(H);
  for(let y=0;y<H;y++){
    let cnt=0;
    for(let x=xL;x<xR;x++){
      const i=(y*W+x)*4;
      if(data[i]>WHITE_THR && data[i+1]>WHITE_THR && data[i+2]>WHITE_THR) cnt++;
    }
    rowWhite[y]=cnt/(xR-xL);
  }
  const sr=gSmooth1D(rowWhite,H,5);

  // 找白色比例最高的行
  const ym=Math.floor(H*0.03);
  let maxWhiteY=ym, maxWhiteVal=0;
  for(let y=ym;y<H-ym;y++) if(sr[y]>maxWhiteVal){ maxWhiteVal=sr[y]; maxWhiteY=y; }

  // 白色區域太少 → 找不到刀口
  if(maxWhiteVal<0.15){
    if(lastKnifeGlobalY!==null){
      // 用上一幀位置繼續
      var globalBestY=lastKnifeGlobalY;
      var globalBestG=0.01; // 標記為低信心
    } else {
      return null;
    }
  } else {
    // 找白色區域的下緣（白色比例從高變低的位置）
    var globalBestY=maxWhiteY, globalBestG=maxWhiteVal;
    for(let y=maxWhiteY;y<H-ym;y++){
      if(sr[y]<maxWhiteVal*0.3){ globalBestY=y; break; }
    }
    lastKnifeGlobalY=globalBestY;
  }

  // 8段各自偵測白色下緣
  const segs=[];
  for(let s=0;s<KNIFE_SEGS;s++){
    const sx=Math.floor(W*(0.05+s*0.9/KNIFE_SEGS));
    const ex=Math.floor(W*(0.05+(s+1)*0.9/KNIFE_SEGS));
    const cx=(sx+ex)/2;
    const segRange=Math.min(80,Math.floor(H*0.15));
    const yS=Math.max(1,globalBestY-segRange), yE=Math.min(H-1,globalBestY+segRange);

    // 計算此段每行的白色比例
    let bestY=globalBestY, bestWhite=0, segMaxWhite=0;
    const segWhite=new Float32Array(H);
    for(let y=yS;y<=yE;y++){
      let cnt=0;
      for(let x=sx;x<ex;x++){
        const i=(y*W+x)*4;
        if(data[i]>WHITE_THR&&data[i+1]>WHITE_THR&&data[i+2]>WHITE_THR) cnt++;
      }
      segWhite[y]=cnt/(ex-sx);
      if(segWhite[y]>segMaxWhite) segMaxWhite=segWhite[y];
    }

    // 找此段白色區域的下緣
    if(segMaxWhite>0.1){
      for(let y=yS;y<=yE;y++){
        if(segWhite[y]===segMaxWhite){ bestY=y; bestWhite=segMaxWhite; }
      }
      // 從最白行往下找白色消失的位置
      for(let y=bestY;y<=yE;y++){
        if(segWhite[y]<segMaxWhite*0.3){ bestY=y; break; }
      }
    }

    // 被遮蓋判斷：此段白色比例遠低於全域
    const covered = segMaxWhite < maxWhiteVal * 0.25;
    const valid   = segMaxWhite > 0.08;

    segs.push({ x:cx, y:bestY, valid, covered, whiteVal:segMaxWhite });
  }
  return segs;
}

// 將 8 段結果平滑並外推被遮蓋的段
function smoothKnifeHistory(history){
  if(!history.length) return null;
  const n=history.length;
  const result=[];
  for(let s=0;s<KNIFE_SEGS;s++){
    // 只取有效且未被遮蓋的幀做加權平均
    let sumY=0, sumW=0, coveredCount=0;
    history.forEach((h,i)=>{
      const seg=h[s];
      if(seg.valid && !seg.covered){ sumY+=seg.y*(i+1); sumW+=(i+1); }
      if(seg.covered) coveredCount++;
    });
    const covered=coveredCount > n*0.5; // 超過一半的幀該段被遮蓋
    const y=sumW>0 ? sumY/sumW : (history[history.length-1][s]?.y || 0);
    result.push({ x:history[0][s].x, y, valid:sumW>0, covered });
  }

  // 被遮蓋的段：用相鄰有效段做線性插值/外推
  const validSegs=result.filter(s=>!s.covered&&s.valid);
  if(validSegs.length>=2){
    const {slope,intercept}=linReg(validSegs.map(s=>s.x), validSegs.map(s=>s.y));
    result.forEach(seg=>{ if(seg.covered||!seg.valid) seg.y=slope*seg.x+intercept; });
  }
  return result;
}

function knifeToLinear(segs){
  if(!segs||!segs.length) return null;
  const xs=segs.map(s=>s.x), ys=segs.map(s=>s.y);
  const {slope,intercept}=linReg(xs,ys);
  return{p1:{x:Math.floor(W*0.05),y:slope*W*0.05+intercept},p2:{x:Math.floor(W*0.95),y:slope*W*0.95+intercept}};
}

// ══════════════════════════════════════════════════════════════════════════
// 畫線偵測
// ══════════════════════════════════════════════════════════════════════════
function detectMark(fd, anchorY){
  const data=fd.data;
  const SEGS=16;
  const sw=Math.floor(W*0.08);
  const xC=Math.floor(W/2);
  const sr2=Math.floor(H*0.4); // 擴大搜尋範圍
  const yS=Math.max(0,anchorY-sr2), yE=Math.min(H-1,anchorY+sr2);

  // 藍色優勢垂直掃描
  const rowScore=new Float32Array(H);
  for(let y=yS;y<=yE;y++){
    let sc=0;
    for(let x=xC-sw;x<xC+sw;x++){
      const i=(y*W+x)*4; const r=data[i],g=data[i+1],b=data[i+2];
      if(r+g+b>620||r+g+b<20) continue;
      const adv=b-Math.max(r,g); if(adv>0) sc+=adv;
    }
    rowScore[y]=sc/(sw*2);
  }
  const sm=gSmooth1D_range(rowScore,yS,yE,5);
  let bY=Math.round(anchorY), bS=0;
  for(let y=yS;y<=yE;y++) if(sm[y]>bS){ bS=sm[y]; bY=y; }
  if(bS<0.05) return null; // 降低門檻，更容易找到藍線

  // 16段亞像素定位
  const sXs=[],sYs=[],sV=[];
  for(let s=0;s<SEGS;s++){
    const sx=Math.floor(W*s/SEGS), ex=Math.floor(W*(s+1)/SEGS), cx=(sx+ex)/2;
    const lr=Math.min(25,Math.floor(H*0.04));
    let tot=0,wY=0,wT=0,lbS=0;
    for(let y=Math.max(0,bY-lr);y<=Math.min(H-1,bY+lr);y++){
      let sc=0,cnt=0;
      for(let x=sx;x<ex;x++){
        const i=(y*W+x)*4; const r=data[i],g=data[i+1],b=data[i+2];
        if(r+g+b>620||r+g+b<20) continue;
        const adv=b-Math.max(r,g); if(adv>0){sc+=adv;cnt++;}
      }
      const avg=cnt?sc/cnt:0;
      if(avg>lbS) lbS=avg;
      tot+=sc; wY+=y*avg; wT+=avg;
    }
    const subY=wT>0?wY/wT:bY;
    sXs.push(cx); sYs.push(subY); sV.push(tot>(ex-sx)*2&&lbS>1); // 降低有效段門檻
  }

  // 線性迴歸外推無效段
  const vXs=sXs.filter((_,i)=>sV[i]), vYs=sYs.filter((_,i)=>sV[i]);
  let rr=null; if(vXs.length>=2) rr=linReg(vXs,vYs);
  const fYs=[...sYs];
  const vIdx=sV.map((v,i)=>v?i:-1).filter(i=>i>=0);
  if(vIdx.length>=2){
    for(let i=0;i<vIdx.length-1;i++){
      const a=vIdx[i],b2=vIdx[i+1];
      for(let s=a+1;s<b2;s++){const t=(s-a)/(b2-a);fYs[s]=sYs[a]*(1-t)+sYs[b2]*t;}
    }
    if(rr){
      for(let s=0;s<vIdx[0];s++) fYs[s]=rr.slope*sXs[s]+rr.intercept;
      for(let s=vIdx[vIdx.length-1]+1;s<SEGS;s++) fYs[s]=rr.slope*sXs[s]+rr.intercept;
    }
  }
  const vc=sV.filter(Boolean).length;
  return{bestY:bY,segXs:sXs,segYs:fYs,segValid:sV,validCount:vc};
}

function smoothMarkHistory(history){
  if(!history.length) return null;
  const SEGS=history[0].segXs.length;
  const sXs=history[0].segXs;
  const sYs=new Array(SEGS).fill(0);
  const sV=new Array(SEGS).fill(0);
  let totalW=0;
  history.forEach((h,i)=>{
    const w=i+1;
    for(let s=0;s<SEGS;s++){
      sYs[s]+=h.segYs[s]*w;
      sV[s]+=h.segValid[s]?w:0;
    }
    totalW+=w;
  });
  for(let s=0;s<SEGS;s++) sYs[s]/=totalW;
  const smoothValid=sV.map(v=>v>totalW*0.4);
  const spline=catmullRom(sXs,sYs,8);
  return{segXs:sXs,segYs:sYs,segValid:smoothValid,spline};
}

// ─── 繪製 ─────────────────────────────────────────────────────────────────

// 繪製鎖定的刀口（用當前偵測結果判斷哪些段被遮蓋）
function drawKnifeLockedSegs(currentSegs){
  if(!knifeLockedSegs) return;
  const xs=knifeLockedSegs.map(s=>s.x), ys=knifeLockedSegs.map(s=>s.y);
  const {slope,intercept}=linReg(xs,ys);

  octx.save();
  // 暗紅底線（延伸到邊緣）
  octx.beginPath();
  octx.moveTo(0,intercept);
  knifeLockedSegs.forEach(s=>octx.lineTo(s.x,s.y));
  octx.lineTo(W,slope*W+intercept);
  octx.strokeStyle='#7a2a2a'; octx.lineWidth=1.5; octx.setLineDash([5,5]); octx.stroke(); octx.setLineDash([]);

  // 判斷哪些段被遮蓋（用當前幀的梯度與鎖定時比較）
  knifeLockedSegs.forEach((seg,s)=>{
    const isCovered = currentSegs && currentSegs[s] && currentSegs[s].covered;
    if(!isCovered){
      const sx=Math.floor(W*(0.05+s*0.9/KNIFE_SEGS));
      const ex=Math.floor(W*(0.05+(s+1)*0.9/KNIFE_SEGS));
      octx.beginPath(); octx.moveTo(sx,seg.y); octx.lineTo(ex,seg.y);
      octx.strokeStyle='#ff5555'; octx.lineWidth=2.5; octx.stroke();
    }
    // 控制點
    octx.beginPath(); octx.arc(seg.x,seg.y,4,0,Math.PI*2);
    octx.fillStyle=isCovered?'#7a2a2a':'#ff5555';
    octx.globalAlpha=isCovered?0.5:0.8; octx.fill(); octx.globalAlpha=1;
  });

  octx.fillStyle='#ff5555'; octx.font='bold 12px Courier New';
  octx.shadowColor='#000'; octx.shadowBlur=3;
  octx.fillText('刀口🔒',12,ys[0]-7); octx.shadowBlur=0;
  octx.restore();
}

function drawKnifeSegs(){
  if(!knifeSegs||!knifeSegs.length) return;
  const xs=knifeSegs.map(s=>s.x), ys=knifeSegs.map(s=>s.y);

  // 延伸到左右邊緣
  const {slope,intercept}=linReg(xs,ys);
  const pts=[{x:0,y:intercept},{...knifeSegs[0]},
    ...knifeSegs,
    {...knifeSegs[knifeSegs.length-1]},{x:W,y:slope*W+intercept}];

  octx.save();
  // 先畫整條暗紅底線（延伸線）
  octx.beginPath();
  pts.forEach((p,i)=>{ if(i===0) octx.moveTo(p.x,p.y); else octx.lineTo(p.x,p.y); });
  octx.strokeStyle='#7a2a2a'; octx.lineWidth=1.5; octx.setLineDash([5,5]); octx.stroke(); octx.setLineDash([]);

  // 再畫有效未遮蓋的段（亮紅色）
  for(let s=0;s<knifeSegs.length;s++){
    if(!knifeSegs[s].covered && knifeSegs[s].valid){
      const sx=Math.floor(W*(0.05+s*0.9/KNIFE_SEGS));
      const ex=Math.floor(W*(0.05+(s+1)*0.9/KNIFE_SEGS));
      octx.beginPath(); octx.moveTo(sx,knifeSegs[s].y); octx.lineTo(ex,knifeSegs[s].y);
      octx.strokeStyle='#ff5555'; octx.lineWidth=2.5; octx.stroke();
    }
  }

  // 控制點
  knifeSegs.forEach(seg=>{
    octx.beginPath(); octx.arc(seg.x,seg.y,4,0,Math.PI*2);
    octx.fillStyle=seg.covered?'#7a2a2a':'#ff5555';
    octx.globalAlpha=seg.covered?0.5:0.8; octx.fill(); octx.globalAlpha=1;
  });

  // 標籤
  octx.fillStyle='#ff5555'; octx.font='bold 12px Courier New';
  octx.shadowColor='#000'; octx.shadowBlur=3;
  octx.fillText('刀口',12,ys[0]-7); octx.shadowBlur=0;
  octx.restore();
}

function drawMark(){
  if(!markData||!markData.spline) return;
  const {segXs,segYs,segValid,spline}=markData;
  const SEGS=segValid.length, pps=Math.ceil(spline.length/SEGS);
  octx.save();
  // 暗藍延伸底線
  octx.beginPath();
  spline.forEach((p,i)=>{ if(i===0) octx.moveTo(p.x,p.y); else octx.lineTo(p.x,p.y); });
  octx.strokeStyle='#1a3a5a'; octx.lineWidth=1.5; octx.setLineDash([4,4]); octx.stroke(); octx.setLineDash([]);
  // 亮藍有效段
  let inV=false;
  spline.forEach((p,i)=>{
    const si=Math.min(SEGS-1,Math.floor(i/pps)), isV=segValid[si];
    if(i===0){ octx.beginPath(); octx.moveTo(p.x,p.y); inV=isV; return; }
    if(isV!==inV){
      if(inV){ octx.strokeStyle='#55aaff'; octx.lineWidth=2.5; octx.setLineDash([]); octx.stroke(); }
      octx.beginPath(); octx.moveTo(p.x,p.y); inV=isV;
    }
    octx.lineTo(p.x,p.y);
  });
  if(inV){ octx.strokeStyle='#55aaff'; octx.lineWidth=2.5; octx.setLineDash([]); octx.stroke(); }
  const fv=segValid.findIndex(Boolean);
  if(fv>=0){
    octx.fillStyle='#55aaff'; octx.font='bold 12px Courier New';
    octx.shadowColor='#000'; octx.shadowBlur=3;
    octx.fillText('畫線',Math.floor(W*fv/SEGS)+4,segYs[fv]-10);
    octx.shadowBlur=0;
  }
  octx.restore();
}

function drawMeasureArrows(kl){
  const lx=W*0.2, rx=W*0.8;
  const kyL=yAtX(kl.p1,kl.p2,lx);
  const kyR=yAtX(kl.p1,kl.p2,rx);
  const myL=spYatX(markData.spline,lx);
  const myR=spYatX(markData.spline,rx);
  drawArrow(lx,kyL,lx,myL,'#ffd060');
  drawArrow(rx,kyR,rx,myR,'#ffd060');
  const ppm=getRW()/W;
  octx.save(); octx.fillStyle='#ffd060'; octx.font='bold 12px Courier New';
  octx.shadowColor='#000'; octx.shadowBlur=3;
  octx.fillText(((myL-kyL)*ppm).toFixed(2)+'mm',lx+8,(kyL+myL)/2+4);
  octx.fillText(((myR-kyR)*ppm).toFixed(2)+'mm',rx+8,(kyR+myR)/2+4);
  octx.shadowBlur=0; octx.restore();
}

function drawArrow(x1,y1,x2,y2,color){
  if(Math.abs(y2-y1)<2) return;
  octx.save(); octx.beginPath(); octx.moveTo(x1,y1); octx.lineTo(x2,y2);
  octx.strokeStyle=color; octx.lineWidth=1.8; octx.stroke();
  const a=Math.atan2(y2-y1,0),s=7;
  octx.beginPath(); octx.moveTo(x2,y2);
  octx.lineTo(x2-s*Math.cos(a-0.4),y2-s*Math.sin(a-0.4));
  octx.lineTo(x2-s*Math.cos(a+0.4),y2-s*Math.sin(a+0.4));
  octx.closePath(); octx.fillStyle=color; octx.fill(); octx.restore();
}

// ─── 即時量測 ─────────────────────────────────────────────────────────────
function updateMetrics(kl){
  const lx=W*0.2, rx=W*0.8;
  const kyL=yAtX(kl.p1,kl.p2,lx);
  const kyR=yAtX(kl.p1,kl.p2,rx);
  const myL=spYatX(markData.spline,lx);
  const myR=spYatX(markData.spline,rx);
  const ppm=getRW()/W;
  const dl=(myL-kyL)*ppm, dr=(myR-kyR)*ppm, diff=Math.abs(dl-dr);
  const fmt=v=>(v>=0?'+':'')+v.toFixed(2);
  document.getElementById('vL').textContent=fmt(dl)+' mm';
  document.getElementById('vR').textContent=fmt(dr)+' mm';
  document.getElementById('vP').textContent=diff.toFixed(2)+' mm';
  document.getElementById('sL').textContent=dl>=0?'畫線在刀口下方':'畫線在刀口上方';
  document.getElementById('sR').textContent=dr>=0?'畫線在刀口下方':'畫線在刀口上方';
  const T=0.5;
  document.getElementById('vL').className='mv '+cls(Math.abs(dl),T);
  document.getElementById('vR').className='mv '+cls(Math.abs(dr),T);
  document.getElementById('vP').className='mv '+cls(diff,T*0.5);
  const maxO=Math.max(Math.abs(dl),Math.abs(dr));
  const dot=document.getElementById('vdot'),txt=document.getElementById('vtxt');
  if(maxO<T&&diff<T*0.5){dot.className='vdot good';txt.textContent=`✅ 對位良好 — 偏移 ${maxO.toFixed(2)} mm，平行差 ${diff.toFixed(2)} mm`;}
  else if(maxO<T*2){dot.className='vdot warn';txt.textContent=`⚠ 需微調 — 偏移 ${maxO.toFixed(2)} mm，平行差 ${diff.toFixed(2)} mm`;}
  else{dot.className='vdot bad';txt.textContent=`✗ 偏移過大 — ${maxO.toFixed(2)} mm，請重新對位`;}
}

function resetMetrics(){
  ['vL','vR','vP'].forEach(id=>{document.getElementById(id).textContent='—';document.getElementById(id).className='mv';});
  document.getElementById('sL').textContent='畫線 vs 刀口';
  document.getElementById('sR').textContent='畫線 vs 刀口';
  document.getElementById('vdot').className='vdot';
  document.getElementById('vtxt').textContent='開啟攝影機後自動偵測刀口，放入鎳板後點擊畫線';
}

// ─── 工具函數 ─────────────────────────────────────────────────────────────
function gBlurY(gray,W,H,r){
  const out=new Float32Array(gray.length);
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    let s=0,w=0;
    for(let d=-r;d<=r;d++){
      const yy=Math.min(H-1,Math.max(0,y+d));
      const wt=Math.exp(-d*d/(2*r*r/4)); s+=gray[yy*W+x]*wt; w+=wt;
    }
    out[y*W+x]=s/w;
  }
  return out;
}
function otsuFull(data,W,H){
  const h=new Array(256).fill(0);
  for(let i=0;i<W*H;i++) h[Math.min(255,Math.floor(data[i]||0))]++;
  const tot=W*H; let sa=0; for(let i=0;i<256;i++) sa+=i*h[i];
  let sb=0,wb=0,bv=0,bt=0;
  for(let t=0;t<256;t++){wb+=h[t];if(!wb)continue;const wf=tot-wb;if(!wf)break;sb+=t*h[t];const mb=sb/wb,mf=(sa-sb)/wf,v=wb*wf*(mb-mf)**2;if(v>bv){bv=v;bt=t;}}
  return bt;
}
function gSmooth1D(arr,len,r){
  const out=new Float32Array(len);
  for(let i=0;i<len;i++){let s=0,w=0;for(let k=-r;k<=r;k++){const idx=Math.min(len-1,Math.max(0,i+k));const wt=Math.exp(-k*k/(2*r*r));s+=arr[idx]*wt;w+=wt;}out[i]=s/w;}
  return out;
}
function gSmooth1D_range(arr,yS,yE,r){
  const out=new Float32Array(arr.length);
  for(let y=yS;y<=yE;y++){let s=0,w=0;for(let k=-r;k<=r;k++){const idx=Math.min(yE,Math.max(yS,y+k));const wt=Math.exp(-k*k/(2*r*r));s+=arr[idx]*wt;w+=wt;}out[y]=s/w;}
  return out;
}
function catmullRom(xs,ys,steps){
  const pts=[],n=xs.length;
  for(let i=0;i<n-1;i++){
    const p0=i>0?{x:xs[i-1],y:ys[i-1]}:{x:xs[i]-(xs[i+1]-xs[i]),y:ys[i]-(ys[i+1]-ys[i])};
    const p1={x:xs[i],y:ys[i]},p2={x:xs[i+1],y:ys[i+1]};
    const p3=i<n-2?{x:xs[i+2],y:ys[i+2]}:{x:xs[i+1]+(xs[i+1]-xs[i]),y:ys[i+1]+(ys[i+1]-ys[i])};
    for(let t=0;t<=steps;t++){
      const tt=t/steps,t2=tt*tt,t3=t2*tt;
      pts.push({x:0.5*((2*p1.x)+(-p0.x+p2.x)*tt+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),y:0.5*((2*p1.y)+(-p0.y+p2.y)*tt+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3)});
    }
  }
  return pts;
}
function linReg(xs,ys){
  const n=xs.length,mx=xs.reduce((a,b)=>a+b)/n,my=ys.reduce((a,b)=>a+b)/n;
  let num=0,den=0; for(let i=0;i<n;i++){num+=(xs[i]-mx)*(ys[i]-my);den+=(xs[i]-mx)**2;}
  const slope=den?num/den:0; return{slope,intercept:my-slope*mx};
}
function spYatX(spline,tx){if(!spline||!spline.length)return 0;let c=spline[0],md=Math.abs(spline[0].x-tx);for(const p of spline){const d=Math.abs(p.x-tx);if(d<md){md=d;c=p;}}return c.y;}
function yAtX(p1,p2,x){if(Math.abs(p2.x-p1.x)<0.5)return p1.y;return p1.y+(p2.y-p1.y)*(x-p1.x)/(p2.x-p1.x);}
function cls(v,t){return v<t*0.5?'good':v<t?'warn':'bad';}
function getRW(){return parseFloat(document.getElementById('realWidth').value)||200;}
function setLive(on,msg){
  document.getElementById('liveDot').className='live-dot'+(on?'':' off');
  document.getElementById('liveTxt').className='live-txt'+(on?'':' off');
  document.getElementById('liveTxt').textContent=msg;
  if(!on) document.getElementById('liveFps').textContent='';
}
function setDC(id,msg,type){
  const el=document.getElementById(id);
  const icon=id==='dcKnife'?'🔴':'🔵';
  el.textContent=icon+' '+(id==='dcKnife'?'刀口':'畫線')+'：'+msg;
  el.className='dc'+(type?' '+type:'');
}
function setHint(msg,type=''){const el=document.getElementById('hint');el.textContent=msg;el.className='hint'+(type?' '+type:'');}
