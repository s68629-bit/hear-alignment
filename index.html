<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>剪床對位 — 即時版</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: #0f1117; color: #e0e6f0; font-family: 'Courier New', monospace; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 10px; }
h1 { font-size: 0.95rem; letter-spacing: 0.12em; color: #7eb8f7; text-transform: uppercase; margin-bottom: 2px; text-align: center; }
.subtitle { font-size: 0.65rem; color: #445566; margin-bottom: 10px; text-align: center; }
.workspace { width: 100%; max-width: 960px; display: flex; flex-direction: column; gap: 8px; }

/* 階段指示 */
.phase-bar { display: flex; border-radius: 5px; overflow: hidden; border: 1px solid #1e2535; }
.phase { flex: 1; padding: 8px; text-align: center; font-size: 0.68rem; background: #0d1018; color: #334455; border-right: 1px solid #1e2535; }
.phase:last-child { border-right: none; }
.phase .pn { font-size: 0.58rem; margin-bottom: 1px; }
.phase .pm { font-weight: bold; }
.phase.active { background: #1a2535; color: #7eb8f7; }
.phase.done   { background: #0e1e14; color: #5dc87a; }

/* 影像區 */
.video-wrap {
  position: relative; width: 100%;
  background: #181c24; border: 1px solid #2a2e3a;
  border-radius: 6px; overflow: hidden;
  min-height: 200px;
}
#liveVideo { display: block; width: 100%; height: auto; }
#overlayCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
.video-placeholder {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 220px; color: #334455; font-size: 0.82rem; gap: 8px;
}
/* 點擊模式時 canvas 可互動 */
.video-wrap.click-mode { cursor: crosshair; }
.video-wrap.click-mode #overlayCanvas { pointer-events: auto; cursor: crosshair; }

/* 即時狀態列 */
.live-status {
  display: flex; align-items: center; gap: 8px;
  background: #0a1a0a; border: 1px solid #2a5a2a;
  border-radius: 5px; padding: 7px 12px; font-size: 0.72rem;
}
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: #5dc87a; box-shadow: 0 0 6px #5dc87a; animation: pulse 1s infinite; flex-shrink: 0; }
.live-dot.off { background: #445566; box-shadow: none; animation: none; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.4} }
.live-txt { color: #5dc87a; flex: 1; }
.live-txt.off { color: #445566; }
.live-fps { font-size: 0.65rem; color: #3a6a3a; }

/* 控制 */
.controls { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  padding: 10px 14px; border: 1px solid #2e3a50; border-radius: 5px;
  background: #181e2c; color: #8ab4e8;
  font-family: inherit; font-size: 0.76rem; cursor: pointer;
  white-space: nowrap; min-height: 42px; transition: all 0.15s;
}
.btn:active:not(:disabled) { background: #1e2840; }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn.red    { background: #2a1010; border-color: #aa3333; color: #ff9090; }
.btn.blue   { background: #101828; border-color: #3366aa; color: #88bbff; }
.btn.green  { background: #0e1e14; border-color: #3a8a4a; color: #7fd4a0; }
.btn.green.on { background: #1a3a1a; border-color: #5aaa6a; box-shadow: 0 0 8px #3a8a3a44; }
.btn.click-active { background: #1e3a28; border-color: #3a8a4a; color: #7fd4a0; animation: blink 0.8s infinite; }
@keyframes blink { 0%,100%{opacity:1}50%{opacity:0.6} }
.divider { flex: 1; min-width: 4px; }

/* 提示 */
.hint { font-size: 0.73rem; color: #556677; padding: 7px 12px; background: #13161e; border-radius: 4px; border-left: 3px solid #2a3a5a; line-height: 1.6; }
.hint.red  { border-left-color: #cc4444; color: #ffaaaa; }
.hint.blue { border-left-color: #4488cc; color: #aaccff; }
.hint.ok   { border-left-color: #44aa66; color: #88ddaa; }
.hint.err  { border-left-color: #cc5555; color: #ffbbbb; }

/* 鎖定狀態 */
.locked-bar { display: none; background: #0e1a12; border: 1px solid #2a5a3a; border-radius: 5px; padding: 7px 12px; font-size: 0.72rem; color: #5dc87a; gap: 8px; align-items: center; }
.locked-bar.show { display: flex; }
.btn.unlock { padding: 5px 10px; font-size: 0.66rem; border-color: #7a4444; color: #cc8888; background: #1a0e0e; min-height: unset; }

/* 圖例 */
.legend { display: flex; gap: 12px; flex-wrap: wrap; background: #0d1018; border: 1px solid #1e2535; border-radius: 5px; padding: 7px 12px; }
.leg { display: flex; align-items: center; gap: 5px; font-size: 0.66rem; color: #556677; }
.leg-line { width: 22px; height: 3px; border-radius: 1px; }
.leg-line.red  { background: #ff5555; }
.leg-line.bhi  { background: #55aaff; }
.leg-line.blo  { background: #1a3a5a; border: 1px dashed #335577; }

/* 數值面板 */
.metrics { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
.mc { background: #13161e; border: 1px solid #1e2535; border-radius: 5px; padding: 10px; }
.ml { font-size: 0.56rem; letter-spacing: 0.1em; color: #445566; text-transform: uppercase; margin-bottom: 3px; }
.mv { font-size: 1.35rem; font-weight: bold; color: #7eb8f7; }
.mv.good { color: #5dc87a; }
.mv.warn { color: #e8c060; }
.mv.bad  { color: #e86060; }
.ms { font-size: 0.56rem; color: #334455; margin-top: 2px; }

/* 判斷 */
.verdict { background: #13161e; border: 1px solid #1e2535; border-radius: 5px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; font-size: 0.76rem; }
.vdot { width: 10px; height: 10px; border-radius: 50%; background: #334455; flex-shrink: 0; }
.vdot.good { background: #5dc87a; box-shadow: 0 0 8px #5dc87a99; }
.vdot.warn { background: #e8c060; box-shadow: 0 0 8px #e8c06099; }
.vdot.bad  { background: #e86060; box-shadow: 0 0 8px #e8606099; }
.vtxt { color: #7a8a9a; line-height: 1.5; }

/* 校準 */
.cal { display: flex; align-items: center; gap: 6px; font-size: 0.7rem; color: #445566; flex-wrap: wrap; }
.cal input { width: 58px; padding: 5px; background: #181e2c; border: 1px solid #2e3a50; border-radius: 3px; color: #8ab4e8; font-family: inherit; font-size: 0.7rem; text-align: center; }
.cal-tip { font-size: 0.6rem; color: #334455; width: 100%; }

<body>
<h1>⚙ 剪床對位 — 即時版</h1>
<p class="subtitle">v1.0 — 即時攝影機 + 刀口鎖定 + 畫線追蹤 + 即時偏差</p>

<div class="workspace">

  <!-- 階段 -->
  <div class="phase-bar">
    <div class="phase active" id="ph1"><div class="pn">STEP 1</div><div class="pm">🔴 鎖定刀口</div></div>
    <div class="phase" id="ph2"><div class="pn">STEP 2</div><div class="pm">🔵 追蹤畫線</div></div>
    <div class="phase" id="ph3"><div class="pn">STEP 3</div><div class="pm">📏 即時對位</div></div>
  </div>

  <!-- 影像 -->
  <div class="video-wrap" id="videoWrap">
    <div class="video-placeholder" id="placeholder">
      <svg width="44" height="44" viewBox="0 0 48 48" fill="none">
        <rect x="4" y="8" width="40" height="28" rx="3" stroke="#446" stroke-width="1.5"/>
        <circle cx="24" cy="22" r="7" stroke="#446" stroke-width="1.5"/>
        <rect x="18" y="4" width="12" height="5" rx="1.5" stroke="#446" stroke-width="1.5"/>
      </svg>
      <span>按「開啟攝影機」開始</span>
    </div>
    <video id="liveVideo" autoplay playsinline muted style="display:none;"></video>
    <canvas id="overlayCanvas" style="display:none;"></canvas>
  </div>

  <!-- 即時狀態列 -->
  <div class="live-status">
    <div class="live-dot off" id="liveDot"></div>
    <span class="live-txt off" id="liveTxt">攝影機未開啟</span>
    <span class="live-fps" id="liveFps"></span>
  </div>

  <!-- STEP 1 控制 -->
  <div class="controls" id="ctrl1">
    <button class="btn green" id="btnCam" onclick="toggleCam()">📹 開啟攝影機</button>
    <button class="btn red" id="btnKnife" onclick="detectKnife()" disabled>🔍 辨識刀口</button>
    <button class="btn" id="btnManualKnife" onclick="startManual('knife')" disabled>✏ 手動刀口</button>
  </div>

  <!-- 刀口鎖定列 -->
  <div class="locked-bar" id="knifeLocked">
    <span>🔒</span>
    <span id="knifeLockedTxt">刀口已鎖定</span>
    <div class="divider"></div>
    <button class="btn unlock" onclick="resetKnife()">解鎖重設</button>
  </div>

  <!-- STEP 2 控制 -->
  <div class="controls" id="ctrl2" style="display:none;">
    <button class="btn blue" id="btnClickMark" onclick="startMarkClick()">👆 點擊畫線定位</button>
    <button class="btn" id="btnManualMark" onclick="startManual('mark')">✏ 手動畫線</button>
    <button class="btn" onclick="resetMark()" style="font-size:0.7rem;">🔄 重設畫線</button>
  </div>

  <!-- 圖例（有資料後才顯示）-->
  <div class="legend" id="legend" style="display:none;">
    <div class="leg"><div class="leg-line red"></div><span>刀口基準線（鎖定）</span></div>
    <div class="leg"><div class="leg-line bhi"></div><span>畫線實測段</span></div>
    <div class="leg"><div class="leg-line blo"></div><span>畫線延伸段（用於比對）</span></div>
  </div>

  <div class="cal">
    <span>畫面實際寬度：</span>
    <input type="number" id="realWidth" value="200" min="10" max="2000">
    <span>mm</span>
    <span class="cal-tip">用尺量拍攝畫面實際寬度，固定架設後只需校準一次。</span>
  </div>

  <div class="hint" id="hint">請先按「開啟攝影機」。</div>

  <!-- 數值 -->
  <div class="metrics">
    <div class="mc"><div class="ml">左側偏移</div><div class="mv" id="vL">—</div><div class="ms" id="sL">畫線 vs 刀口</div></div>
    <div class="mc"><div class="ml">右側偏移</div><div class="mv" id="vR">—</div><div class="ms" id="sR">畫線 vs 刀口</div></div>
    <div class="mc"><div class="ml">平行度差</div><div class="mv" id="vP">—</div><div class="ms">左右差值</div></div>
  </div>

  <div class="verdict">
    <div class="vdot" id="vdot"></div>
    <div class="vtxt" id="vtxt">完成兩個步驟後即時顯示量測結果</div>
  </div>

</div>

<script>
// ─── 狀態 ─────────────────────────────────────────────────────────────────
const video   = document.getElementById('liveVideo');
const overlay = document.getElementById('overlayCanvas');
const octx    = overlay.getContext('2d');
let W=0, H=0;
let stream=null, running=false, raf=null;
let frameCount=0, lastFpsT=0;

// 刀口（鎖定後不動）
let knifeData = null;   // { xs, ys } 8段控制點
let knifeLinear = null; // { p1, p2 } 量測用直線

// 畫線（持續追蹤，每幀重新掃描）
let markAnchorY = null; // 點擊後的初始 Y 基準
let markData = null;    // { segXs, segYs, segValid, spline, regrLine }

let manualMode = 'none'; // 'knife' | 'mark' | 'none'
let manualBuf = [];
let markClickPending = false;

// ─── 攝影機 ───────────────────────────────────────────────────────────────
async function toggleCam(){
  if(running){ stopCam(); return; }
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:'environment', width:{ideal:1280}, height:{ideal:720} }
    });
    video.srcObject = stream;
    video.style.display = 'block';
    document.getElementById('placeholder').style.display = 'none';
    video.onloadedmetadata = () => {
      const wrap = document.getElementById('videoWrap');
      const scale = Math.min(1, (wrap.clientWidth||900) / video.videoWidth);
      W = Math.round(video.videoWidth  * scale);
      H = Math.round(video.videoHeight * scale);
      overlay.width=W; overlay.height=H;
      overlay.style.display='block';
      overlay.style.width='100%';
    };
    running = true;
    document.getElementById('btnCam').className='btn green on';
    document.getElementById('btnCam').textContent='📹 攝影機開啟中';
    document.getElementById('btnKnife').disabled=false;
    document.getElementById('btnManualKnife').disabled=false;
    setLiveStatus(true,'攝影機已開啟');
    setHint('STEP 1：放入剪床（不放鎳板），按「辨識刀口」鎖定刀口基準線。','red');
    loop();
  } catch(e){ setHint('⚠ 無法開啟攝影機：'+e.message,'err'); }
}

function stopCam(){
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  running=false; if(raf){ cancelAnimationFrame(raf); raf=null; }
  video.style.display='none'; video.srcObject=null;
  overlay.style.display='none';
  document.getElementById('btnCam').className='btn green';
  document.getElementById('btnCam').textContent='📹 開啟攝影機';
  setLiveStatus(false,'攝影機已關閉');
}

// ─── 主迴圈 ───────────────────────────────────────────────────────────────
function loop(){
  if(!running){ return; }
  frameCount++;
  const now=performance.now();
  if(now-lastFpsT>1000){
    document.getElementById('liveFps').textContent=frameCount+' fps';
    frameCount=0; lastFpsT=now;
  }

  // 把 video 畫到隱藏 canvas 取像素（僅在需要時）
  octx.clearRect(0,0,W,H);

  // 1. 畫刀口線（已鎖定，直接畫）
  if(knifeData) drawKnifeCurve();
  else if(knifeLinear) drawLine(knifeLinear.p1, knifeLinear.p2, '#ff5555', '刀口基準');

  // 2. 畫線追蹤（有基準 Y 就每幀重新掃描）
  if(markAnchorY!==null && knifeLinear){
    const frameData = getFramePixels();
    if(frameData){
      const result = scanMarkLine(frameData, markAnchorY);
      if(result){ markData=result; }
    }
  }
  if(markData) drawMarkLines();

  // 3. 即時量測
  if(knifeLinear && markData) calcAndShowMetrics();

  // 4. 手動標記暫時點
  drawManualTemp();

  raf = requestAnimationFrame(loop);
}

// ─── 取得當前幀像素 ───────────────────────────────────────────────────────
let offCanvas=null, offCtx=null;
function getFramePixels(){
  if(!offCanvas){ offCanvas=document.createElement('canvas'); offCtx=offCanvas.getContext('2d'); }
  offCanvas.width=W; offCanvas.height=H;
  offCtx.drawImage(video,0,0,W,H);
  return offCtx.getImageData(0,0,W,H);
}

// ══════════════════════════════════════════════════════════════════════════
// STEP 1：辨識刀口（一次性，鎖定後不動）
// ══════════════════════════════════════════════════════════════════════════
function detectKnife(){
  if(!running){ setHint('⚠ 請先開啟攝影機。','err'); return; }
  setHint('🔍 辨識刀口中…','red');
  const fd=getFramePixels(); if(!fd) return;
  const data=fd.data;
  const gray=new Uint8Array(W*H);
  for(let i=0;i<W*H;i++) gray[i]=Math.round(data[i*4]*0.299+data[i*4+1]*0.587+data[i*4+2]*0.114);
  const blurred=gBlur2D(gray,W,H,11);
  const thr=otsu(blurred);
  const xL=Math.floor(W*0.25), xR=Math.floor(W*0.75);
  const rw=new Float32Array(H);
  for(let y=0;y<H;y++){ let c=0; for(let x=xL;x<xR;x++) if(blurred[y*W+x]>thr) c++; rw[y]=c/(xR-xL); }
  const sr=gSmooth1D(rw,8);
  const grad=new Float32Array(H);
  for(let y=2;y<H-2;y++) grad[y]=sr[y-2]-sr[y+2];
  const ym=Math.floor(H*0.05);
  let bY=Math.floor(H/2),bG=0;
  for(let y=ym;y<H-ym;y++) if(grad[y]>bG){ bG=grad[y]; bY=y; }

  // 8段曲線
  const SEGS=8; const sXs=[],sYs=[];
  for(let s=0;s<SEGS;s++){
    const sx=Math.floor(W*(0.05+s*0.9/SEGS)), ex=Math.floor(W*(0.05+(s+1)*0.9/SEGS));
    sXs.push((sx+ex)/2); sYs.push(findEdge(blurred,sx,ex,bY,W,H));
  }
  const {slope:sl,intercept:ic}=linReg(sXs,sYs);
  const lx=Math.floor(W*0.05), rx=Math.floor(W*0.95);
  knifeData={xs:sXs,ys:sYs};
  knifeLinear={p1:{x:lx,y:Math.round(sl*lx+ic)},p2:{x:rx,y:Math.round(sl*rx+ic)}};

  lockKnife();
}

function lockKnife(){
  document.getElementById('ph1').className='phase done';
  document.getElementById('ph2').className='phase active';
  document.getElementById('ctrl1').style.display='none';
  document.getElementById('ctrl2').style.display='flex';
  document.getElementById('knifeLocked').classList.add('show');
  document.getElementById('knifeLocked').querySelector('#knifeLockedTxt').textContent=
    `刀口已鎖定（Y≈${Math.round((knifeLinear.p1.y+knifeLinear.p2.y)/2)}px）`;
  document.getElementById('legend').style.display='flex';
  setHint('✅ 刀口鎖定！STEP 2：放入有畫線的鎳板，按「點擊畫線定位」。','ok');
}

function resetKnife(){
  knifeData=null; knifeLinear=null; markAnchorY=null; markData=null;
  document.getElementById('ph1').className='phase active';
  document.getElementById('ph2').className='phase';
  document.getElementById('ph3').className='phase';
  document.getElementById('ctrl1').style.display='flex';
  document.getElementById('ctrl2').style.display='none';
  document.getElementById('knifeLocked').classList.remove('show');
  document.getElementById('legend').style.display='none';
  resetMetrics();
  setHint('STEP 1：放入剪床，按「辨識刀口」。','red');
}

// ══════════════════════════════════════════════════════════════════════════
// STEP 2：點擊定位畫線，之後每幀自動追蹤
// ══════════════════════════════════════════════════════════════════════════
function startMarkClick(){
  if(!knifeLinear){ setHint('⚠ 請先鎖定刀口。','err'); return; }
  markClickPending=true;
  document.getElementById('btnClickMark').className='btn blue click-active';
  document.getElementById('btnClickMark').textContent='👆 點擊中…';
  document.getElementById('videoWrap').classList.add('click-mode');
  setHint('👆 請點擊鎳板上藍色/紫色畫線的位置（點附近即可）。','blue');
}

// 點擊事件
overlay.addEventListener('click', handleOverlayClick);
overlay.addEventListener('touchend', e=>{
  e.preventDefault();
  const t=e.changedTouches[0], r=overlay.getBoundingClientRect();
  handleOverlayXY((t.clientX-r.left)*(W/r.width),(t.clientY-r.top)*(H/r.height));
},{passive:false});

function handleOverlayClick(e){
  const r=overlay.getBoundingClientRect();
  handleOverlayXY((e.clientX-r.left)*(W/r.width),(e.clientY-r.top)*(H/r.height));
}

function handleOverlayXY(x,y){
  if(markClickPending){
    markClickPending=false;
    document.getElementById('btnClickMark').className='btn blue';
    document.getElementById('btnClickMark').textContent='👆 點擊畫線定位';
    document.getElementById('videoWrap').classList.remove('click-mode');
    // 用點擊位置做一次精確定位，取得 anchorY
    const fd=getFramePixels();
    if(fd){
      const result=scanMarkLine(fd,y);
      if(result){
        markAnchorY=result.bestY;
        markData=result;
        document.getElementById('ph2').className='phase done';
        document.getElementById('ph3').className='phase active';
        setHint('✅ 畫線已定位，即時追蹤中。調整鎳板位置使偏差趨近 0。','ok');
      }
    }
    return;
  }
  if(manualMode!=='none') handleManualPoint(x,y);
}

// ─── 每幀掃描畫線（以 anchorY 為中心）──────────────────────────────────────
function scanMarkLine(imgData, anchorY){
  const data=imgData.data;
  const SEGS=16;
  const segXs=[],segYs=[],segValid=[];

  // 全域峰值確認
  const sw=Math.floor(W*0.08);
  const xC=Math.floor(W/2);
  const sr2=Math.floor(H*0.2);
  const yS=Math.max(0,anchorY-sr2), yE=Math.min(H-1,anchorY+sr2);
  const rowS=new Float32Array(H);
  for(let y=yS;y<=yE;y++){
    let s=0;
    for(let x=xC-sw;x<xC+sw;x++){
      const i=(y*W+x)*4; const r=data[i],g=data[i+1],b=data[i+2];
      if(r+g+b>620||r+g+b<20) continue;
      const adv=b-Math.max(r,g); if(adv>0) s+=adv;
    }
    rowS[y]=s/(sw*2);
  }
  const sm=gSmooth1D(rowS,5);
  let bY=Math.round(anchorY),bS=0;
  for(let y=yS;y<=yE;y++) if(sm[y]>bS){ bS=sm[y]; bY=y; }

  for(let s=0;s<SEGS;s++){
    const sx=Math.floor(W*s/SEGS), ex=Math.floor(W*(s+1)/SEGS), cx=(sx+ex)/2;
    const lr=Math.min(30,Math.floor(H*0.05));
    let tot=0,wY=0,wT=0,lbS=0;
    for(let y=Math.max(0,bY-lr);y<=Math.min(H-1,bY+lr);y++){
      let sc=0,cnt=0;
      for(let x=sx;x<ex;x++){
        const i=(y*W+x)*4; const r=data[i],g=data[i+1],b=data[i+2];
        if(r+g+b>620||r+g+b<20) continue;
        const adv=b-Math.max(r,g); if(adv>0){sc+=adv;cnt++;}
      }
      const avg=cnt?sc/cnt:0;
      if(avg>lbS) lbS=avg;
      tot+=sc; wY+=y*avg; wT+=avg;
    }
    const subY=wT>0?wY/wT:bY;
    const sw2=ex-sx;
    segXs.push(cx); segYs.push(subY);
    segValid.push(tot>sw2*8&&lbS>5);
  }

  // 線性迴歸（有效段）
  const vXs=segXs.filter((_,i)=>segValid[i]);
  const vYs=segYs.filter((_,i)=>segValid[i]);
  let regrLine=null;
  if(vXs.length>=2){ const r=linReg(vXs,vYs); regrLine=r; }

  // 填補無效段
  const fYs=[...segYs];
  const vIdx=segValid.map((v,i)=>v?i:-1).filter(i=>i>=0);
  if(vIdx.length>=2){
    for(let i=0;i<vIdx.length-1;i++){
      const a=vIdx[i],b=vIdx[i+1];
      for(let s=a+1;s<b;s++){const t=(s-a)/(b-a);fYs[s]=segYs[a]*(1-t)+segYs[b]*t;}
    }
    if(regrLine){
      for(let s=0;s<vIdx[0];s++) fYs[s]=regrLine.slope*segXs[s]+regrLine.intercept;
      for(let s=vIdx[vIdx.length-1]+1;s<SEGS;s++) fYs[s]=regrLine.slope*segXs[s]+regrLine.intercept;
    }
  }

  const spline=catmullRom(segXs,fYs,8);
  const vc=segValid.filter(Boolean).length;
  return{bestY:bY,segXs,segYs:fYs,segValid,spline,regrLine,validCount:vc,confidence:Math.min(100,Math.round(Math.min(bS/30,1)*50+(vc/SEGS)*50))};
}

// ─── 繪製 ─────────────────────────────────────────────────────────────────
function drawKnifeCurve(){
  if(!knifeData) return;
  const {xs,ys}=knifeData;
  octx.save(); octx.beginPath();
  const s0=(ys[1]-ys[0])/(xs[1]-xs[0]||1);
  octx.moveTo(0,ys[0]-s0*xs[0]);
  for(let i=0;i<xs.length;i++) octx.lineTo(xs[i],ys[i]);
  const sl=(ys[xs.length-1]-ys[xs.length-2])/(xs[xs.length-1]-xs[xs.length-2]||1);
  octx.lineTo(W,ys[xs.length-1]+sl*(W-xs[xs.length-1]));
  octx.strokeStyle='#ff5555'; octx.lineWidth=2; octx.setLineDash([7,4]); octx.stroke(); octx.setLineDash([]);
  octx.fillStyle='#ff5555'; octx.font='bold 12px Courier New';
  octx.shadowColor='#000'; octx.shadowBlur=3;
  octx.fillText('刀口基準',12,ys[0]-7); octx.shadowBlur=0; octx.restore();
}

function drawLine(p1,p2,color,label){
  const e=extLine(p1,p2);
  octx.save(); octx.beginPath(); octx.moveTo(e.x1,e.y1); octx.lineTo(e.x2,e.y2);
  octx.strokeStyle=color; octx.lineWidth=2; octx.setLineDash([7,4]); octx.stroke(); octx.setLineDash([]);
  octx.fillStyle=color; octx.font='bold 12px Courier New';
  octx.shadowColor='#000'; octx.shadowBlur=3;
  octx.fillText(label,12,(p1.y+p2.y)/2-7); octx.shadowBlur=0; octx.restore();
}

function drawMarkLines(){
  if(!markData||!markData.spline) return;
  const {segXs,segYs,segValid,spline}=markData;
  const SEGS=segValid.length, pps=Math.ceil(spline.length/SEGS);
  octx.save();
  // 暗色底線（全段）
  octx.beginPath();
  spline.forEach((p,i)=>{ if(i===0) octx.moveTo(p.x,p.y); else octx.lineTo(p.x,p.y); });
  octx.strokeStyle='#1a3a5a'; octx.lineWidth=1.5; octx.setLineDash([4,4]); octx.stroke(); octx.setLineDash([]);
  // 亮色有效段
  let inV=false;
  spline.forEach((p,i)=>{
    const si=Math.min(SEGS-1,Math.floor(i/pps)), isV=segValid[si];
    if(i===0){ octx.beginPath(); octx.moveTo(p.x,p.y); inV=isV; return; }
    if(isV!==inV){
      if(inV){ octx.strokeStyle='#55aaff'; octx.lineWidth=2.5; octx.setLineDash([]); octx.stroke(); }
      octx.beginPath(); octx.moveTo(p.x,p.y); inV=isV;
    }
    octx.lineTo(p.x,p.y);
  });
  if(inV){ octx.strokeStyle='#55aaff'; octx.lineWidth=2.5; octx.setLineDash([]); octx.stroke(); }
  // 標籤
  const fv=segValid.findIndex(Boolean);
  if(fv>=0){
    octx.fillStyle='#55aaff'; octx.font='bold 12px Courier New';
    octx.shadowColor='#000'; octx.shadowBlur=3;
    octx.fillText('畫線',Math.floor(W*fv/SEGS)+4,segYs[fv]-10);
    octx.shadowBlur=0;
  }
  octx.restore();
}

function drawManualTemp(){
  if(manualBuf.length===0) return;
  const p=manualBuf[manualBuf.length-1];
  octx.save(); octx.beginPath(); octx.arc(p.x,p.y,8,0,Math.PI*2);
  octx.strokeStyle=manualMode==='knife'?'#ff5555':'#55aaff'; octx.lineWidth=2; octx.stroke();
  octx.restore();
}

function drawArrowOctx(x1,y1,x2,y2,color){
  if(Math.abs(y2-y1)<2) return;
  octx.save(); octx.beginPath(); octx.moveTo(x1,y1); octx.lineTo(x2,y2);
  octx.strokeStyle=color; octx.lineWidth=1.8; octx.stroke();
  const a=Math.atan2(y2-y1,0),s=7;
  octx.beginPath(); octx.moveTo(x2,y2);
  octx.lineTo(x2-s*Math.cos(a-0.4),y2-s*Math.sin(a-0.4));
  octx.lineTo(x2-s*Math.cos(a+0.4),y2-s*Math.sin(a+0.4));
  octx.closePath(); octx.fillStyle=color; octx.fill(); octx.restore();
}

// ─── 即時量測 ─────────────────────────────────────────────────────────────
function calcAndShowMetrics(){
  const lx=W*0.2, rx=W*0.8;
  const kyL=yAtX(knifeLinear.p1,knifeLinear.p2,lx);
  const kyR=yAtX(knifeLinear.p1,knifeLinear.p2,rx);
  const myL=spYatX(markData.spline,lx);
  const myR=spYatX(markData.spline,rx);

  // 畫箭頭
  drawArrowOctx(lx,kyL,lx,myL,'#ffd060');
  drawArrowOctx(rx,kyR,rx,myR,'#ffd060');
  const ppm=getRW()/W;
  octx.save(); octx.fillStyle='#ffd060'; octx.font='bold 12px Courier New';
  octx.shadowColor='#000'; octx.shadowBlur=3;
  octx.fillText(((myL-kyL)*ppm).toFixed(2)+'mm',lx+8,(kyL+myL)/2+4);
  octx.fillText(((myR-kyR)*ppm).toFixed(2)+'mm',rx+8,(kyR+myR)/2+4);
  octx.shadowBlur=0; octx.restore();

  const dl=(myL-kyL)*ppm, dr=(myR-kyR)*ppm, diff=Math.abs(dl-dr);
  const fmt=v=>(v>=0?'+':'')+v.toFixed(2);
  document.getElementById('vL').textContent=fmt(dl)+' mm';
  document.getElementById('vR').textContent=fmt(dr)+' mm';
  document.getElementById('vP').textContent=diff.toFixed(2)+' mm';
  document.getElementById('sL').textContent=dl>=0?'畫線在刀口下方':'畫線在刀口上方';
  document.getElementById('sR').textContent=dr>=0?'畫線在刀口下方':'畫線在刀口上方';
  const T=0.5;
  document.getElementById('vL').className='mv '+cls(Math.abs(dl),T);
  document.getElementById('vR').className='mv '+cls(Math.abs(dr),T);
  document.getElementById('vP').className='mv '+cls(diff,T*0.5);
  const maxO=Math.max(Math.abs(dl),Math.abs(dr));
  const dot=document.getElementById('vdot'),txt=document.getElementById('vtxt');
  if(maxO<T&&diff<T*0.5){dot.className='vdot good';txt.textContent=`✅ 對位良好 — 偏移 ${maxO.toFixed(2)} mm，平行差 ${diff.toFixed(2)} mm`;}
  else if(maxO<T*2){dot.className='vdot warn';txt.textContent=`⚠ 需微調 — 偏移 ${maxO.toFixed(2)} mm，平行差 ${diff.toFixed(2)} mm`;}
  else{dot.className='vdot bad';txt.textContent=`✗ 偏移過大 — ${maxO.toFixed(2)} mm，請重新對位`;}
}

function resetMetrics(){
  ['vL','vR','vP'].forEach(id=>{document.getElementById(id).textContent='—';document.getElementById(id).className='mv';});
  document.getElementById('sL').textContent='畫線 vs 刀口';
  document.getElementById('sR').textContent='畫線 vs 刀口';
  document.getElementById('vdot').className='vdot';
  document.getElementById('vtxt').textContent='完成兩個步驟後即時顯示量測結果';
}

// ─── 手動標記 ─────────────────────────────────────────────────────────────
function startManual(type){
  manualMode=type; manualBuf=[];
  document.getElementById('videoWrap').classList.add('click-mode');
  setHint(type==='knife'?'✏ 點左端 → 右端 各1點定義刀口線':'✏ 點左端 → 右端 各1點定義畫線',type==='knife'?'red':'blue');
}

function handleManualPoint(x,y){
  manualBuf.push({x,y});
  if(manualBuf.length>=2){
    const p1=manualBuf[manualBuf.length-2], p2=manualBuf[manualBuf.length-1];
    if(manualMode==='knife'){
      knifeLinear={p1,p2}; knifeData=null; lockKnife();
    } else {
      markAnchorY=(p1.y+p2.y)/2;
      // 建立直線 markData
      const SEGS=16, sXs=[],sYs=[],sV=[];
      for(let s=0;s<SEGS;s++){
        const cx=W*(s+0.5)/SEGS;
        sXs.push(cx); sYs.push(yAtX(p1,p2,cx)); sV.push(true);
      }
      const sp=catmullRom(sXs,sYs,8);
      const rr=linReg(sXs,sYs);
      markData={segXs:sXs,segYs:sYs,segValid:sV,spline:sp,regrLine:rr,bestY:markAnchorY,validCount:SEGS,confidence:100};
      document.getElementById('ph2').className='phase done';
      document.getElementById('ph3').className='phase active';
      setHint('✅ 畫線已手動標記，即時追蹤中。','ok');
    }
    manualMode='none'; manualBuf=[];
    document.getElementById('videoWrap').classList.remove('click-mode');
  }
}

function resetMark(){
  markAnchorY=null; markData=null;
  document.getElementById('ph2').className='phase active';
  document.getElementById('ph3').className='phase';
  resetMetrics();
  setHint('STEP 2：按「點擊畫線定位」重新定位。','blue');
}

// ─── 工具函數 ─────────────────────────────────────────────────────────────
function gBlur2D(gray,W,H,r){
  const k=makeGK(r),tmp=new Float32Array(W*H),out=new Float32Array(W*H);
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){let s=0,w=0;for(let d=-r;d<=r;d++){const xx=Math.min(W-1,Math.max(0,x+d));const wt=k[d+r];s+=gray[y*W+xx]*wt;w+=wt;}tmp[y*W+x]=s/w;}
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){let s=0,w=0;for(let d=-r;d<=r;d++){const yy=Math.min(H-1,Math.max(0,y+d));const wt=k[d+r];s+=tmp[yy*W+x]*wt;w+=wt;}out[y*W+x]=s/w;}
  return out;
}
function makeGK(r){const k=[];for(let i=-r;i<=r;i++)k.push(Math.exp(-i*i/(2*r*r/4)));return k;}
function otsu(data){const h=new Array(256).fill(0);for(let i=0;i<data.length;i++)h[Math.min(255,Math.floor(data[i]))]++;const tot=data.length;let sa=0;for(let i=0;i<256;i++)sa+=i*h[i];let sb=0,wb=0,bv=0,bt=0;for(let t=0;t<256;t++){wb+=h[t];if(!wb)continue;const wf=tot-wb;if(!wf)break;sb+=t*h[t];const mb=sb/wb,mf=(sa-sb)/wf,v=wb*wf*(mb-mf)**2;if(v>bv){bv=v;bt=t;}}return bt;}
function gSmooth1D(arr,r){const out=new Float32Array(arr.length);for(let i=0;i<arr.length;i++){let s=0,w=0;for(let k=-r;k<=r;k++){const idx=Math.min(arr.length-1,Math.max(0,i+k));const wt=Math.exp(-k*k/(2*r*r));s+=arr[idx]*wt;w+=wt;}out[i]=s/w;}return out;}
function findEdge(blurred,xS,xE,aY,W,H){const r=Math.min(80,Math.floor(H*0.15));const yS=Math.max(2,aY-r),yE=Math.min(H-2,aY+r);let bY=aY,bG=0;for(let y=yS;y<yE;y++){let a=0,b=0,c=0;for(let x=xS;x<xE;x++){a+=blurred[Math.max(0,y-3)*W+x];b+=blurred[Math.min(H-1,y+3)*W+x];c++;}const g=(a-b)/c;if(g>bG){bG=g;bY=y;}}return bY;}
function catmullRom(xs,ys,steps){const pts=[],n=xs.length;for(let i=0;i<n-1;i++){const p0=i>0?{x:xs[i-1],y:ys[i-1]}:{x:xs[i]-(xs[i+1]-xs[i]),y:ys[i]-(ys[i+1]-ys[i])};const p1={x:xs[i],y:ys[i]};const p2={x:xs[i+1],y:ys[i+1]};const p3=i<n-2?{x:xs[i+2],y:ys[i+2]}:{x:xs[i+1]+(xs[i+1]-xs[i]),y:ys[i+1]+(ys[i+1]-ys[i])};for(let t=0;t<=steps;t++){const tt=t/steps,t2=tt*tt,t3=t2*tt;pts.push({x:0.5*((2*p1.x)+(-p0.x+p2.x)*tt+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),y:0.5*((2*p1.y)+(-p0.y+p2.y)*tt+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3)});}}return pts;}
function linReg(xs,ys){const n=xs.length,mx=xs.reduce((a,b)=>a+b)/n,my=ys.reduce((a,b)=>a+b)/n;let num=0,den=0;for(let i=0;i<n;i++){num+=(xs[i]-mx)*(ys[i]-my);den+=(xs[i]-mx)**2;}const slope=den?num/den:0;return{slope,intercept:my-slope*mx};}
function spYatX(spline,tx){if(!spline||!spline.length)return 0;let c=spline[0],md=Math.abs(spline[0].x-tx);for(const p of spline){const d=Math.abs(p.x-tx);if(d<md){md=d;c=p;}}return c.y;}
function yAtX(p1,p2,x){if(Math.abs(p2.x-p1.x)<0.5)return p1.y;return p1.y+(p2.y-p1.y)*(x-p1.x)/(p2.x-p1.x);}
function extLine(p1,p2){if(Math.abs(p2.x-p1.x)<0.5)return{x1:p1.x,y1:0,x2:p1.x,y2:H};const m=(p2.y-p1.y)/(p2.x-p1.x),b=p1.y-m*p1.x;return{x1:0,y1:b,x2:W,y2:m*W+b};}
function cls(v,t){return v<t*0.5?'good':v<t?'warn':'bad';}
function getRW(){return parseFloat(document.getElementById('realWidth').value)||200;}
function setLiveStatus(on,msg){
  document.getElementById('liveDot').className='live-dot'+(on?'':' off');
  document.getElementById('liveTxt').className='live-txt'+(on?'':' off');
  document.getElementById('liveTxt').textContent=msg;
  if(!on) document.getElementById('liveFps').textContent='';
}
function setHint(msg,type=''){const el=document.getElementById('hint');el.textContent=msg;el.className='hint'+(type?' '+type:'');}
</script>
